<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1090" viewBox="0 0 1280 1090" role="img" aria-labelledby="title desc">
<title id="title">同一个 Agent 服务：按 session 和 run 隔离，受控共享资源</title><desc id="desc">同一个 Agent 服务加载通用程序并调度多个 session。每个 session 有独立对话历史，每次 run 绑定自己的版本清单、工作目录、工具上下文、进程与额度。通过统一工具入口执行身份校验和审计，再访问只读快照、分区缓存与外部系统。</desc>
<style>text{font-family:Helvetica Neue, Arial, PingFang SC, Microsoft YaHei, sans-serif}</style>
<defs>
<marker id="blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563eb"/></marker>
<marker id="green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#059669"/></marker>
<marker id="red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#dc2626"/></marker>
<marker id="gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#6b7280"/></marker>
</defs>
<rect width="1280" height="1090" fill="#ffffff"/>
<text x="48" y="55" font-size="30" fill="#111827" font-weight="600" text-anchor="start">同一个 Agent 服务，多个 session 并发执行相似任务</text>
<text x="48" y="94" font-size="21" fill="#6b7280" font-weight="400" text-anchor="start">复用程序与不可变能力包；每次执行携带身份、版本、目录和预算</text>
<rect x="40" y="122" width="1200" height="878" rx="16" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="64" y="157" font-size="21" fill="#475569" font-weight="600" text-anchor="start">Agent 服务 / Runtime</text>
<rect x="350" y="180" width="580" height="88" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="640" y="216" font-size="25" fill="#111827" font-weight="600" text-anchor="middle">共享程序与调度入口</text>
<text x="640" y="247" font-size="20" fill="#6b7280" font-weight="400" text-anchor="middle">并发准入 · 公平调度 · 全局额度 · 取消与回收</text>
<path d="M 470 268 V 296 H 334 V 328" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M 810 268 V 296 H 946 V 328" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="74" y="328" width="520" height="282" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="98" y="368" font-size="24" fill="#111827" font-weight="600" text-anchor="start">Session A · 排查支付超时</text>
<text x="98" y="405" font-size="20" fill="#475569" font-weight="400" text-anchor="start">独立历史 / 检查点 / 记忆访问范围</text>
<rect x="94" y="426" width="480" height="161" rx="12" fill="#eff6ff" stroke="#dbeafe" stroke-width="1.6"/>
<text x="111" y="459" font-size="21" fill="#111827" font-weight="600" text-anchor="start">run A1 · 提交 a1… · Skill v3</text>
<text x="111" y="495" font-size="21" fill="#1d4ed8" font-weight="400" text-anchor="start">/sessions/A/runs/A1/</text>
<text x="111" y="530" font-size="20" fill="#475569" font-weight="400" text-anchor="start">独立 cwd / tmp / build / shell 与进程组</text>
<text x="111" y="564" font-size="20" fill="#475569" font-weight="400" text-anchor="start">受限文件访问 · 按调用授权 · 本次执行额度</text>
<rect x="686" y="328" width="520" height="282" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="710" y="368" font-size="24" fill="#111827" font-weight="600" text-anchor="start">Session B · 排查支付超时</text>
<text x="710" y="405" font-size="20" fill="#475569" font-weight="400" text-anchor="start">独立历史 / 检查点 / 记忆访问范围</text>
<rect x="706" y="426" width="480" height="161" rx="12" fill="#eff6ff" stroke="#dbeafe" stroke-width="1.6"/>
<text x="723" y="459" font-size="21" fill="#111827" font-weight="600" text-anchor="start">run B1 · 提交 b7… · Skill v3</text>
<text x="723" y="495" font-size="21" fill="#1d4ed8" font-weight="400" text-anchor="start">/sessions/B/runs/B1/</text>
<text x="723" y="530" font-size="20" fill="#475569" font-weight="400" text-anchor="start">独立 cwd / tmp / build / shell 与进程组</text>
<text x="723" y="564" font-size="20" fill="#475569" font-weight="400" text-anchor="start">受限文件访问 · 按调用授权 · 本次执行额度</text>
<path d="M 334 610 V 670" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M 946 610 V 670" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="210" y="670" width="860" height="96" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<text x="640" y="707" font-size="24" fill="#111827" font-weight="600" text-anchor="middle">统一工具入口：校验 session / run / 身份 / 目标资源</text>
<text x="640" y="741" font-size="20" fill="#6b7280" font-weight="400" text-anchor="middle">绑定工具上下文 · 检查权限 · 限流 · 写入幂等与互斥 · 审计</text>
<path d="M 250 766 V 836" fill="none" stroke="#059669" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#green)"/>
<path d="M 640 766 V 836" fill="none" stroke="#059669" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#green)"/>
<path d="M 1030 766 V 836" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="197.0" y="791" width="106" height="28" rx="4" fill="#ffffff" stroke="none" stroke-width="1.6"/>
<text x="250" y="809" font-size="18" fill="#059669" font-weight="400" text-anchor="middle">按版本只读</text>
<rect x="587.0" y="791" width="106" height="28" rx="4" fill="#ffffff" stroke="none" stroke-width="1.6"/>
<text x="640" y="809" font-size="18" fill="#059669" font-weight="400" text-anchor="middle">按授权分区</text>
<rect x="986.0" y="791" width="88" height="28" rx="4" fill="#ffffff" stroke="none" stroke-width="1.6"/>
<text x="1030" y="809" font-size="18" fill="#2563eb" font-weight="400" text-anchor="middle">受控读写</text>
<rect x="74" y="836" width="348" height="128" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.6"/>
<text x="248" y="872" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">不可变共享输入</text>
<text x="248" y="909" font-size="20" fill="#475569" font-weight="400" text-anchor="middle">代码 / Skill / 依赖快照</text>
<text x="248" y="943" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">只读挂载 · 内容哈希</text>
<rect x="466" y="836" width="348" height="128" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.6"/>
<text x="640" y="872" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">缓存与知识服务</text>
<text x="640" y="909" font-size="20" fill="#475569" font-weight="400" text-anchor="middle">租户 / 权限 / 版本键</text>
<text x="640" y="943" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">并发安全 · 禁止越权命中</text>
<rect x="858" y="836" width="348" height="128" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="1032" y="872" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">MCP / 数据库 / 外部系统</text>
<text x="1032" y="909" font-size="20" fill="#475569" font-weight="400" text-anchor="middle">每次调用带授权上下文</text>
<text x="1032" y="943" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">按业务对象协调共享写入</text>
<path d="M 55 1037 H 95" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="110" y="1044" font-size="19" fill="#6b7280" font-weight="400" text-anchor="start">执行 / 受控工具调用</text>
<path d="M 400 1037 H 440" fill="none" stroke="#059669" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="455" y="1044" font-size="19" fill="#6b7280" font-weight="400" text-anchor="start">共享读取（仍需授权）</text>
<text x="822" y="1044" font-size="18" fill="#6b7280" font-weight="400" text-anchor="start">虚线：作用域；访问边界由沙箱等机制落实</text>
</svg>
