<text x="1096.0" y="402" text-anchor="middle" font-size="23" font-weight="600">预算与资源</text>
<text x="1096.0" y="432" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">Token / 费用 / 时间</text>
<text x="1096.0" y="459" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">并发 / 配额 / 截止</text>
<text x="1096.0" y="486" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">分配、计量与终止</text>
<rect x="992" y="578" width="208" height="237" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1096.0" y="613" text-anchor="middle" font-size="23" font-weight="600">观测与治理</text>
<text x="1096.0" y="643" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">Trace / Audit</text>
<text x="1096.0" y="670" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">指标 / 脱敏 / 告警</text>
