<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1310" viewBox="0 0 1280 1310" role="img" aria-labelledby="title desc">
<title id="title">通用 Agent Runtime：组件组成</title>
<desc id="desc">控制面管理任务权威状态与调度，执行面运行模型和工具；预算与观测贯穿各组件，底层依赖提供实际执行和隔离。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
<style>text{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1e293b} .sub{fill:#64748b}</style>
<rect width="1280" height="1310" fill="white"/>
<text x="640" y="57" text-anchor="middle" font-size="32" font-weight="600">通用 Agent Runtime：组件组成</text>
<text x="640" y="94" text-anchor="middle" font-size="20" font-weight="400" style="fill:#64748b">职责参考架构 · 组件可合并部署，也可拆分为服务与 Worker</text>
<rect x="310" y="125" width="660" height="78" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="640.0" y="160" text-anchor="middle" font-size="23" font-weight="600">交互与接入：Chat / App / API / Event</text>
