<rect x="40" y="240" width="1200" height="800" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="640" y="273" text-anchor="middle" font-size="24" font-weight="600">Agent Runtime</text>
<rect x="64" y="294" width="888" height="335" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="508" y="331" text-anchor="middle" font-size="23" font-weight="600">控制面：持有任务权威状态，决定下一步与执行条件</text>
<rect x="84" y="352" width="268" height="115" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="218.0" y="387" text-anchor="middle" font-size="23" font-weight="600">任务与生命周期</text>
<text x="218.0" y="417" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">Task / Run / 取消 / 交接</text>
<text x="218.0" y="444" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">契约与完成条件</text>
<rect x="372" y="352" width="268" height="115" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="506.0" y="387" text-anchor="middle" font-size="23" font-weight="600">规划与调度</text>
<text x="506.0" y="417" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">Loop 编排 / Step 租约</text>
<text x="506.0" y="444" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">重试 / 恢复 / 停止</text>
<rect x="660" y="352" width="268" height="115" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="794.0" y="387" text-anchor="middle" font-size="23" font-weight="600">策略与人工控制</text>
<text x="794.0" y="417" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">身份 / 权限 / 审批</text>
<text x="794.0" y="444" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">逐动作 allow / deny / ask</text>
<rect x="84" y="490" width="268" height="115" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="218.0" y="525" text-anchor="middle" font-size="23" font-weight="600">配置与能力注册</text>
<text x="218.0" y="555" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">Model / Tool / Skill / Source</text>
<text x="218.0" y="582" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">配置与版本快照</text>
<rect x="372" y="490" width="268" height="115" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="506.0" y="525" text-anchor="middle" font-size="23" font-weight="600">持久状态管理</text>
<text x="506.0" y="555" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">事件 / Checkpoint / 版本</text>
<text x="506.0" y="582" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">提交校验与恢复位置</text>
<rect x="660" y="490" width="268" height="115" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="794.0" y="525" text-anchor="middle" font-size="23" font-weight="600">上下文与记忆策略</text>
<text x="794.0" y="555" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">选择证据 / 能力过滤</text>
<text x="794.0" y="582" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">记忆读写与上下文规则</text>
