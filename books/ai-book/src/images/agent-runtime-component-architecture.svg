<text x="1099.0" y="1135" text-anchor="middle" font-size="23" font-weight="600">宿主操作系统</text>
<text x="1099.0" y="1165" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">容器 / 沙箱 / 文件系统</text>
