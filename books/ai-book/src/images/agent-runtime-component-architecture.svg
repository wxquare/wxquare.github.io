<text x="218.0" y="781" text-anchor="middle" font-size="23" font-weight="600">上下文与模型执行</text>
<text x="218.0" y="811" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">检索 / Context Builder</text>
<text x="218.0" y="838" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">模型调用 / 候选动作</text>
<rect x="372" y="746" width="268" height="119" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="506.0" y="781" text-anchor="middle" font-size="23" font-weight="600">工具与环境执行</text>
<text x="506.0" y="811" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">Engine / Tool Runtime</text>
<text x="506.0" y="838" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">超时 / 沙箱 / 协议适配</text>
<rect x="660" y="746" width="268" height="119" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="794.0" y="781" text-anchor="middle" font-size="23" font-weight="600">验证与交付执行</text>
<text x="794.0" y="811" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">Verifier / 产物检查</text>
<text x="794.0" y="838" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">答复 / 报告 / 工单回执</text>
<rect x="976" y="294" width="240" height="594" rx="16" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="1096" y="335" text-anchor="middle" font-size="24" font-weight="600">横切能力</text>
