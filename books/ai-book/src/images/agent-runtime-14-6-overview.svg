<rect width="1440" height="1170" fill="#ffffff"/>
<text x="60" y="46" font-size="18" font-weight="600" fill="#2563eb">AGENT RUNTIME / 16.6</text>
<text x="60" y="91" font-size="32" font-weight="600" fill="#111827">按需求增加能力，按新增责任验收</text>
<text x="60" y="128" font-size="20" fill="#64748b">持久化、业务写入和并发分工可以独立建设；每个阶段都可以稳定交付</text>
<rect x="40" y="250" width="640" height="400" rx="12" fill="#f8fafc" fill-opacity="0.45" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="64" y="289" text-anchor="start" font-size="24" font-weight="600" fill="#64748b">应用内 Runtime</text>
<rect x="60" y="940" width="1320" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="84" y="974" text-anchor="start" font-size="20" font-weight="600" fill="#64748b">平台化单独评估</text>
<text x="280.0" y="1005" text-anchor="middle" font-size="22" font-weight="600" fill="#64748b">触发条件</text>
<text x="280.0" y="1035" text-anchor="middle" font-size="18" font-weight="400" fill="#475569">多个应用重复维护稳定机制</text>
<text x="720.0" y="1005" text-anchor="middle" font-size="22" font-weight="600" fill="#64748b">抽取内容</text>
<text x="720.0" y="1035" text-anchor="middle" font-size="18" font-weight="400" fill="#475569">接口、版本、调度与治理</text>
<text x="1160.0" y="1005" text-anchor="middle" font-size="22" font-weight="600" fill="#64748b">验收重点</text>
<text x="1160.0" y="1035" text-anchor="middle" font-size="18" font-weight="400" fill="#475569">状态归属、隔离与故障责任</text>
<path d="M 310,440 L 390,440" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<path d="M 680,440 L 750,440" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 750,245 L 750,745" fill="none" stroke="#64748b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 750,245 L 860,245" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<path d="M 750,495 L 860,495" fill="none" stroke="#ea580c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<path d="M 750,745 L 860,745" fill="none" stroke="#059669" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<rect x="60" y="340" width="250" height="200" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.8"/>
<text x="185.0" y="402.0" text-anchor="middle" font-size="24" font-weight="600" fill="#2563eb">最小 Runtime</text>
<text x="185.0" y="442.0" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">固定输入与执行路径</text>
<text x="185.0" y="472.0" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">模型调用、验收与返回</text>
<text x="185.0" y="502.0" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">身份、预算和错误边界</text>
<rect x="390" y="340" width="250" height="200" rx="9" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.8"/>
<text x="515.0" y="402.0" text-anchor="middle" font-size="24" font-weight="600" fill="#7c3aed">受控工具循环</text>
<text x="515.0" y="442.0" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">可信目录与结构化观察</text>
<text x="515.0" y="472.0" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">逐动作裁决与停止条件</text>
<text x="515.0" y="502.0" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">单进程也能实现</text>
<rect x="860" y="170" width="520" height="150" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.8"/>
<text x="1120.0" y="222.0" text-anchor="middle" font-size="24" font-weight="600" fill="#2563eb">跨请求等待或重启</text>
<text x="1120.0" y="262.0" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">增加持久状态、Checkpoint 与恢复扫描</text>
<text x="1120.0" y="292.0" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">验收：沿同一 Run 继续，复用确认结果</text>
<rect x="860" y="420" width="520" height="150" rx="9" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.8"/>
<text x="1120.0" y="472.0" text-anchor="middle" font-size="24" font-weight="600" fill="#ea580c">需要修改外部状态</text>
<text x="1120.0" y="512.0" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">增加审批、Operation、幂等与回执核验</text>
<text x="1120.0" y="542.0" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">验收：未知结果、批准失效和取消竞态</text>
<rect x="860" y="670" width="520" height="150" rx="9" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.8"/>
<text x="1120.0" y="722.0" text-anchor="middle" font-size="24" font-weight="600" fill="#059669">容量压力或独立专业边界</text>
<text x="1120.0" y="762.0" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">增加配额、资源隔离；需要时再做受限委派</text>
<text x="1120.0" y="792.0" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">验收：公平调度、子结果验收与父任务收敛</text>
<text x="360" y="616" text-anchor="middle" font-size="19" font-weight="400" fill="#64748b">工具循环仅在需要动态补证时加入。</text>
<text x="720" y="1110" text-anchor="middle" font-size="21" font-weight="600" fill="#475569">每次演进都说明：需求缺口 → 新增机制与责任 → 可核对的验收证据。</text>
<rect x="323.0" y="408" width="54" height="30" rx="4" fill="#ffffff" fill-opacity="0.97"/>
<text x="350" y="431" text-anchor="middle" font-size="18" font-weight="400" fill="#2563eb">补证</text>
<path d="M60,884 H102" stroke="#2563eb" stroke-width="2.4" fill="none" marker-end="url(#arrow-blue)"/>
<text x="117" y="890" text-anchor="start" font-size="17" font-weight="400" fill="#64748b">持久任务</text>
<path d="M360,884 H402" stroke="#ea580c" stroke-width="2.4" fill="none" marker-end="url(#arrow-orange)"/>
<text x="417" y="890" text-anchor="start" font-size="17" font-weight="400" fill="#64748b">受控业务写入</text>
<path d="M660,884 H702" stroke="#059669" stroke-width="2.4" fill="none" marker-end="url(#arrow-green)"/>
<text x="717" y="890" text-anchor="start" font-size="17" font-weight="400" fill="#64748b">并发与专业分工</text>
</svg>
