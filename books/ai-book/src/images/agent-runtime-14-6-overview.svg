<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1170" viewBox="0 0 1440 1170" role="img" aria-labelledby="title desc">
<title id="title">16.6 按需求增加能力，按新增责任验收</title>
<desc id="desc">持久化、业务写入和并发分工可以独立建设；每个阶段都可以稳定交付。本书通用 Runtime 参考设计。</desc>
<style>text{font-family:Helvetica Neue,Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif}</style>
<defs>
<marker id="arrow-blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3.5 L0,7 Z" fill="#2563eb"/></marker>
