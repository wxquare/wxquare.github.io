<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
<title id="title">业务能力契约：操作、输入、结果与可靠性</title>
<desc id="desc">业务能力从操作范围、输入归属、结果语义和可靠性声明四个维度定义。四者共同交付给 Runtime 与调用适配器。模型 Schema 与 MCP 编码只是对应协议的投影，不替代业务保证或当前授权。</desc>
<style>text{font-family:Helvetica Neue,Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif}</style>
<defs><marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#059669"/></marker></defs>
<rect width="1440" height="640" fill="#ffffff"/>
<text x="56" y="42" font-size="17" font-weight="600" fill="#2563eb">EXTERNAL CAPABILITIES / 16.2</text>
<text x="56" y="90" font-size="32" font-weight="600" fill="#111827">业务能力契约：操作、输入、结果与可靠性</text>
<text x="56" y="128" font-size="20" font-weight="400" fill="#475569">能力提供方声明并实现业务保证；Runtime 决定当前任务怎样选择、授权和执行。</text>
<rect x="56" y="176" width="296" height="224" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="80" y="218" font-size="24" font-weight="600" fill="#111827">操作范围</text>
<text x="80" y="269" font-size="18" font-weight="400" fill="#475569">服务 / 环境 / 时间窗口</text>
<text x="80" y="308" font-size="18" font-weight="400" fill="#475569">只读诊断与建单分开</text>
<text x="80" y="347" font-size="18" font-weight="400" fill="#475569">组合能力声明内部最高影响</text>
<path d="M204,400 V448" fill="none" stroke="#059669" stroke-width="2.3"/>
<rect x="400" y="176" width="296" height="224" rx="10" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5"/>
<text x="424" y="218" font-size="24" font-weight="600" fill="#111827">输入归属</text>
<text x="424" y="269" font-size="18" font-weight="400" fill="#475569">业务条件由调用方提出</text>
<text x="424" y="308" font-size="18" font-weight="400" fill="#475569">身份与连接由可信系统绑定</text>
<text x="424" y="347" font-size="18" font-weight="400" fill="#475569">实际载荷绑定版本与批准</text>
<path d="M548,400 V448" fill="none" stroke="#059669" stroke-width="2.3"/>
<rect x="744" y="176" width="296" height="224" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<text x="768" y="218" font-size="24" font-weight="600" fill="#111827">结果语义</text>
<text x="768" y="269" font-size="18" font-weight="400" fill="#475569">成功 / 空 / 部分 / 失败</text>
<text x="768" y="308" font-size="18" font-weight="400" fill="#475569">覆盖缺口、来源与数据引用</text>
<text x="768" y="347" font-size="18" font-weight="400" fill="#475569">coverage 与 effect 独立</text>
<path d="M892,400 V448" fill="none" stroke="#059669" stroke-width="2.3"/>
<rect x="1088" y="176" width="296" height="224" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="1112" y="218" font-size="24" font-weight="600" fill="#111827">可靠性声明</text>
<text x="1112" y="269" font-size="18" font-weight="400" fill="#475569">幂等范围、有效期与载荷</text>
<text x="1112" y="308" font-size="18" font-weight="400" fill="#475569">原动作查询与补偿限制</text>
<text x="1112" y="347" font-size="18" font-weight="400" fill="#475569">超时不证明业务未生效</text>
<path d="M1236,400 V448" fill="none" stroke="#059669" stroke-width="2.3"/>
<path d="M204,448 H1236 M720,448 V488" fill="none" stroke="#059669" stroke-width="2.3" marker-end="url(#arrow-green)"/>
<rect x="56" y="488" width="1328" height="104" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="80" y="528" font-size="24" font-weight="600" fill="#111827">交付给 Runtime 与调用适配器的业务契约</text>
<text x="80" y="567" font-size="20" font-weight="400" fill="#475569">模型 Schema 和 MCP 编码按各自协议投影；声明性质不自动授予执行权限。</text>
</svg>
