<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1260" viewBox="0 0 1280 1260" role="img" aria-labelledby="title desc">
<title id="title">Runtime 的八个核心能力与五类产品的关注重点</title>
<desc id="desc">中心圆圈为 Runtime，周围八个圆圈分别是上下文与记忆、工具与执行环境、规划编排与调度、持久状态与恢复、身份权限与审批、预算与生命周期、验证与产物交付、观测审计与反馈。各能力圆圈底部的彩色文字标记表示建议重点关注的产品形态：网为网页助手，本为本地 Agent，云为云端 Agent，业为业务 Bot，个为个人助手。网页助手关注上下文和交付，本地 Agent 关注执行环境、权限、资源生命周期和验证，云端 Agent 关注工具、编排、恢复、预算和观测，业务 Bot 关注授权、恢复、验证和审计，个人助手关注记忆、主动调度、授权和生命周期。标记是本书工程建议，不是产品评分；未标记的能力仍可能需要，同一任务可以叠加多种要求。连线仅表示能力组成，不表示执行顺序。</desc>
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<rect width="1280" height="1260" fill="#ffffff"/>
