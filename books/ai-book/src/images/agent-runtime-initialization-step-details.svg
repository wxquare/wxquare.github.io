<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1760" viewBox="0 0 1280 1760" role="img" aria-labelledby="title desc">
<title id="title">Runtime 初始化各步骤的输入、动作与产物</title>
<desc id="desc">七步依次说明配置解析、基础设施初始化、能力发现注册、策略编译绑定、依赖检查、发布就绪快照以及等待与接收请求，每一步列出输入、处理和输出。具体权限与任务上下文在请求进入后装配。</desc>
