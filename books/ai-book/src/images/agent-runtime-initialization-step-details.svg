<text x="640" y="94" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#64748b">输入 → 初始化动作 → 可检查的产物 · 与启动总览图的 01–07 对应</text>
