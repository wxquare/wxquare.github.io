<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">14.5 从最后可信事实决定恢复动作</title>
<desc id="desc">覆盖投递、执行权、副作用、Checkpoint、人工控制以及交付与协作。本书通用 Runtime 参考设计。</desc>
<style>text{font-family:Helvetica Neue,Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif}</style>
<defs>
