<marker id="arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3.5 L0,7 Z" fill="#059669"/></marker>
<marker id="start-green" markerWidth="9" markerHeight="7" refX="1" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9,0 L0,3.5 L9,7 Z" fill="#059669"/></marker>
<marker id="arrow-purple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3.5 L0,7 Z" fill="#7c3aed"/></marker>
<marker id="start-purple" markerWidth="9" markerHeight="7" refX="1" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9,0 L0,3.5 L9,7 Z" fill="#7c3aed"/></marker>
<marker id="arrow-gray" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3.5 L0,7 Z" fill="#64748b"/></marker>
<marker id="start-gray" markerWidth="9" markerHeight="7" refX="1" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9,0 L0,3.5 L9,7 Z" fill="#64748b"/></marker>
</defs>
<rect width="1440" height="1080" fill="#ffffff"/>
<text x="60" y="46" font-size="18" font-weight="600" fill="#2563eb">AGENT RUNTIME / 14.5</text>
<text x="60" y="91" font-size="32" font-weight="600" fill="#111827">从最后可信事实决定恢复动作</text>
<text x="60" y="128" font-size="20" fill="#64748b">覆盖投递、执行权、副作用、Checkpoint、人工控制以及交付与协作</text>
<rect x="60" y="870" width="1320" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="84" y="904" text-anchor="start" font-size="20" font-weight="600" fill="#64748b">恢复和收尾的共同约束</text>
<text x="280.0" y="935" text-anchor="middle" font-size="22" font-weight="600" fill="#64748b">执行终态不倒退</text>
<text x="280.0" y="965" text-anchor="middle" font-size="18" font-weight="400" fill="#475569">取消后禁止新业务动作</text>
<text x="720.0" y="935" text-anchor="middle" font-size="22" font-weight="600" fill="#64748b">未知事实不删除</text>
<text x="720.0" y="965" text-anchor="middle" font-size="18" font-weight="400" fill="#475569">先核验，再补记或授权补偿</text>
<text x="1160.0" y="935" text-anchor="middle" font-size="22" font-weight="600" fill="#64748b">处理责任不丢失</text>
<text x="1160.0" y="965" text-anchor="middle" font-size="18" font-weight="400" fill="#475569">保存责任人、证据与期限</text>
<path d="M 280,460 L 360,460" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<path d="M 600,460 L 680,460" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<path d="M 920,460 L 985,460" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 985,230 L 985,690" fill="none" stroke="#64748b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 985,230 L 1050,230" fill="none" stroke="#059669" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<path d="M 985,460 L 1050,460" fill="none" stroke="#ea580c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<path d="M 985,690 L 1050,690" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-purple)"/>
<rect x="60" y="390" width="220" height="140" rx="9" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.8"/>
<text x="170.0" y="436.0" text-anchor="middle" font-size="22" font-weight="600" fill="#ea580c">异常或控制事件</text>
<text x="170.0" y="476.0" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">失败、中断与超时</text>
<text x="170.0" y="506.0" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">撤权、取消与迟到</text>
<rect x="360" y="370" width="240" height="180" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.8"/>
<text x="480.0" y="421.5" text-anchor="middle" font-size="23" font-weight="600" fill="#2563eb">读取权威状态</text>
<text x="480.0" y="461.5" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">状态版本与执行权</text>
<text x="480.0" y="491.5" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">Checkpoint 与产物</text>
<text x="480.0" y="521.5" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">原 Operation 事实</text>
<rect x="680" y="390" width="240" height="140" rx="9" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.8"/>
<text x="800.0" y="436.5" text-anchor="middle" font-size="23" font-weight="600" fill="#7c3aed">分类与恢复准入</text>
<text x="800.0" y="476.5" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">是否可以安全重复</text>
<text x="800.0" y="506.5" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">当前权限与剩余预算</text>
<rect x="1050" y="160" width="330" height="140" rx="9" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.8"/>
<text x="1215.0" y="206.5" text-anchor="middle" font-size="23" font-weight="600" fill="#059669">可恢复的计算</text>
<text x="1215.0" y="246.5" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">复用已经确认的结果</text>
<text x="1215.0" y="276.5" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">允许时有界重算或幂等重试</text>
<rect x="1050" y="390" width="330" height="140" rx="9" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.8"/>
<text x="1215.0" y="436.5" text-anchor="middle" font-size="23" font-weight="600" fill="#ea580c">外部结果未知</text>
<text x="1215.0" y="476.5" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">按原 Operation 查询</text>
<text x="1215.0" y="506.5" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">无结论时保持未知或转人工</text>
<rect x="1050" y="620" width="330" height="140" rx="9" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.8"/>
<text x="1215.0" y="666.5" text-anchor="middle" font-size="23" font-weight="600" fill="#7c3aed">授权或版本不满足</text>
<text x="1215.0" y="706.5" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">暂停、重新裁决或接管</text>
<text x="1215.0" y="736.5" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">不绕过拒绝、撤权和审批</text>
<path d="M60,1034 H102" stroke="#2563eb" stroke-width="2.4" fill="none" marker-end="url(#arrow-blue)"/>
<text x="117" y="1040" text-anchor="start" font-size="17" font-weight="400" fill="#64748b">读取可信依据</text>
<path d="M360,1034 H402" stroke="#059669" stroke-width="2.4" fill="none" marker-end="url(#arrow-green)"/>
<text x="417" y="1040" text-anchor="start" font-size="17" font-weight="400" fill="#64748b">受控继续</text>
<path d="M660,1034 H702" stroke="#ea580c" stroke-width="2.4" fill="none" marker-end="url(#arrow-orange)"/>
<text x="717" y="1040" text-anchor="start" font-size="17" font-weight="400" fill="#64748b">事实核验</text>
<path d="M960,1034 H1002" stroke="#7c3aed" stroke-width="2.4" fill="none" marker-end="url(#arrow-purple)"/>
<text x="1017" y="1040" text-anchor="start" font-size="17" font-weight="400" fill="#64748b">暂停或人工处理</text>
</svg>
