<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1160" viewBox="0 0 1280 1160" role="img" aria-labelledby="title desc">
<title id="title">渐进式加载：先发现，再展开，按需取用</title><desc id="desc">三层加载：索引元数据用于选择，选中后读取 SKILL.md，执行中按需读取参考资料、执行脚本、使用资产。结果经运行时回到任务上下文。</desc>
<style>text{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<defs>
<marker id="a2563eb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563eb"/></marker>
<marker id="a6b7280" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#6b7280"/></marker>
<marker id="a9333ea" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#9333ea"/></marker>
<marker id="adc2626" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#dc2626"/></marker>
<marker id="a16a34a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#16a34a"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="1160" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="55" y="60" font-size="32" fill="#111827" font-weight="600" text-anchor="start">渐进式加载：先发现，再展开，按需取用</text>
<text x="55" y="99" font-size="21" fill="#6b7280" font-weight="400" text-anchor="start">例：用户请求“发布后延迟为什么升高？”</text>
<text x="55" y="185" font-size="24" fill="#2563eb" font-weight="600" text-anchor="start">01 发现层</text>
<text x="55" y="220" font-size="18" fill="#6b7280" font-weight="400" text-anchor="start">先判断相关性</text>
<rect x="280" y="135" width="920" height="155" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="740.0" y="170" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">Skill 索引：name + description</text>
<text x="740.0" y="205" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">结合任务、环境与可用依赖选择能力</text>
<text x="740.0" y="234" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">选择 incident-diagnosis；不加载其他 Skill 的完整正文</text>
<path d="M 740 290 V 355" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#a2563eb)"/>
<rect x="668.0" y="311" width="144" height="26" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="740" y="329" font-size="18" fill="#2563eb" font-weight="400" text-anchor="middle">任务匹配后读取</text>
<text x="55" y="410" font-size="24" fill="#9333ea" font-weight="600" text-anchor="start">02 指令层</text>
<text x="55" y="445" font-size="18" fill="#6b7280" font-weight="400" text-anchor="start">读取核心规则</text>
<rect x="280" y="355" width="920" height="155" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="740.0" y="390" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">选中 Skill：完整 SKILL.md</text>
<text x="740.0" y="425" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">输入、步骤、约束、失败处理、完成标准</text>
<text x="740.0" y="454" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">明确何时读取资源；不能仅凭描述开始执行</text>
<path d="M 740 510 V 555 H 430 V 635" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#a2563eb)"/>
<path d="M 740 555 V 635" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#a2563eb)"/>
<path d="M 740 555 H 1050 V 635" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#a2563eb)"/>
<rect x="621.0" y="559" width="238" height="28" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="740" y="579" font-size="20" fill="#2563eb" font-weight="400" text-anchor="middle">沿当前任务分支取用资源</text>
<text x="55" y="695" font-size="24" fill="#16a34a" font-weight="600" text-anchor="start">03 资源层</text>
<text x="55" y="730" font-size="18" fill="#6b7280" font-weight="400" text-anchor="start">读取 / 执行 / 使用</text>
<rect x="280" y="635" width="300" height="180" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="430.0" y="670" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">references/</text>
<text x="430.0" y="705" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">读取指标口径、日志字段</text>
<text x="430.0" y="734" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">只读当前所需文件</text>
<text x="430.0" y="763" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">内容进入任务上下文</text>
<rect x="600" y="635" width="280" height="180" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="740.0" y="670" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">scripts/</text>
<text x="740.0" y="705" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">执行报告校验脚本</text>
<text x="740.0" y="734" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">无需预读全部源码</text>
<text x="740.0" y="763" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">保留必要结果与错误</text>
<rect x="900" y="635" width="300" height="180" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="1050.0" y="670" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">assets/</text>
<text x="1050.0" y="705" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">使用事故报告模板</text>
<text x="1050.0" y="734" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">按需检查或修改材料</text>
<text x="1050.0" y="763" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">不预加载整个资产库</text>
<path d="M 430 815 V 875 H 740 V 930" fill="none" stroke="#6b7280" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#a6b7280)"/>
<path d="M 740 815 V 930" fill="none" stroke="#6b7280" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#a6b7280)"/>
<path d="M 1050 815 V 875 H 740" fill="none" stroke="#6b7280" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#a6b7280)"/>
<rect x="280" y="930" width="920" height="120" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="740.0" y="965" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">继续任务：取证 → 推理 → 验证 → 报告</text>
<text x="740.0" y="1000" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">必要知识和工具结果进入上下文；工具调用继续接受 Runtime Policy 检查</text>
<text x="55" y="1110" font-size="19" fill="#6b7280" font-weight="400" text-anchor="start">蓝色箭头：选择与取用路径     灰色箭头：必要知识、结果与产物状态回到任务</text>
</svg>
