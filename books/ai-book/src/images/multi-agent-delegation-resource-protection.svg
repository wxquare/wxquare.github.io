<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1220" viewBox="0 0 1280 1220" role="img" aria-labelledby="title desc">
<title id="title">多 Agent 协作：受限委派、独立写入与受控交接</title>
<desc id="desc">协调者提出分工，Runtime 校验权限、预算与执行代次。日志、代码和变更分析 Agent 拥有各自的执行范围，经过统一工具与产物入口访问共享只读快照、提交不可变产物或受控调用外部系统。集成者核验基线、结果和授权后，向唯一集成目录提交变更。</desc>
<style>text{font-family:Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif}</style>
<defs>
<marker id="blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563eb"/></marker>
<marker id="green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#059669"/></marker>
<marker id="orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#ea580c"/></marker>
</defs>
<rect width="1280" height="1220" fill="#ffffff"/>
<text x="48" y="55" font-size="30" fill="#111827" font-weight="600" text-anchor="start">多 Agent 协作：受限委派、独立写入与受控交接</text>
<text x="48" y="94" font-size="21" fill="#6b7280" font-weight="400" text-anchor="start">同一根任务共享目标与固定输入；每个 Agent / attempt 的权限、状态和产物有明确归属</text>
<rect x="40" y="124" width="1200" height="1030" rx="12" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="66" y="160" font-size="21" fill="#475569" font-weight="600" text-anchor="start">根任务 / 委派树</text>
<rect x="305" y="184" width="670" height="104" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<text x="640" y="220" font-size="24" fill="#111827" font-weight="600" text-anchor="middle">协调者提出分工，Runtime 校验并签发执行范围</text>
<text x="640" y="255" font-size="21" fill="#6b7280" font-weight="400" text-anchor="middle">原始授权 ∩ 可转授权限 ∩ 角色范围 ∩ 当前策略</text>
<path d="M 454 288 V 316 H 248 V 356" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#orange)"/>
<path d="M 640 288 V 356" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#orange)"/>
<path d="M 826 288 V 316 H 1032 V 356" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#orange)"/>
<rect x="74" y="356" width="348" height="239" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="248" y="395" font-size="24" fill="#111827" font-weight="600" text-anchor="middle">日志分析 Agent</text>
<text x="248" y="430" font-size="20" fill="#1d4ed8" font-weight="400" text-anchor="middle">agent L · attempt L1</text>
<rect x="90" y="450" width="316" height="128" rx="12" fill="#eff6ff" stroke="#dbeafe" stroke-width="1.6"/>
<text x="248" y="484" font-size="20" fill="#475569" font-weight="400" text-anchor="middle">限定接口 / 实例 / 时间窗</text>
<text x="248" y="521" font-size="20" fill="#475569" font-weight="400" text-anchor="middle">日志工具 + 私有 tmp</text>
<text x="248" y="558" font-size="19" fill="#475569" font-weight="400" text-anchor="middle">无代码写权 / 无变更权限</text>
<rect x="466" y="356" width="348" height="239" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="640" y="395" font-size="24" fill="#111827" font-weight="600" text-anchor="middle">代码分析 Agent</text>
<text x="640" y="430" font-size="20" fill="#1d4ed8" font-weight="400" text-anchor="middle">agent C · attempt C1</text>
<rect x="482" y="450" width="316" height="128" rx="12" fill="#eff6ff" stroke="#dbeafe" stroke-width="1.6"/>
<text x="640" y="484" font-size="20" fill="#475569" font-weight="400" text-anchor="middle">绑定提交 + 独立 worktree</text>
<text x="640" y="521" font-size="20" fill="#475569" font-weight="400" text-anchor="middle">代码工具 + 私有 build</text>
<text x="640" y="558" font-size="19" fill="#475569" font-weight="400" text-anchor="middle">只写本任务目录 / 无发布权</text>
<rect x="858" y="356" width="348" height="239" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="1032" y="395" font-size="24" fill="#111827" font-weight="600" text-anchor="middle">变更核对 Agent</text>
<text x="1032" y="430" font-size="20" fill="#1d4ed8" font-weight="400" text-anchor="middle">agent D · attempt D1</text>
<rect x="874" y="450" width="316" height="128" rx="12" fill="#eff6ff" stroke="#dbeafe" stroke-width="1.6"/>
<text x="1032" y="484" font-size="20" fill="#475569" font-weight="400" text-anchor="middle">限定环境 / 发布与配置范围</text>
<text x="1032" y="521" font-size="20" fill="#475569" font-weight="400" text-anchor="middle">只读变更工具 + 私有 tmp</text>
<text x="1032" y="558" font-size="19" fill="#475569" font-weight="400" text-anchor="middle">不借用其他 Agent 的凭证</text>
<path d="M 248 595 V 670" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M 640 595 V 670" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M 1032 595 V 670" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="518.15" y="619" width="243.7" height="28" rx="12" fill="#ffffff" stroke="none" stroke-width="1.6"/>
<text x="640" y="637" font-size="18" fill="#2563eb" font-weight="400" text-anchor="middle">工具调用 / 证据与产物提交</text>
<rect x="164" y="670" width="952" height="92" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<text x="640" y="707" font-size="25" fill="#111827" font-weight="600" text-anchor="middle">受控工具与产物入口</text>
<text x="640" y="741" font-size="21" fill="#6b7280" font-weight="400" text-anchor="middle">校验身份与资源 · 核对 attempt / 代次 · 根预算扣减 · 审计</text>
<path d="M 248 762 V 834" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M 640 762 V 834" fill="none" stroke="#059669" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#green)"/>
<path d="M 1032 762 V 834" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="186.0" y="786" width="124" height="28" rx="12" fill="#ffffff" stroke="none" stroke-width="1.6"/>
<text x="248" y="804" font-size="18" fill="#2563eb" font-weight="400" text-anchor="middle">提交固定产物</text>
<rect x="578.0" y="786" width="124" height="28" rx="12" fill="#ffffff" stroke="none" stroke-width="1.6"/>
<text x="640" y="804" font-size="18" fill="#059669" font-weight="400" text-anchor="middle">授权只读共享</text>
<rect x="979.0" y="786" width="106" height="28" rx="12" fill="#ffffff" stroke="none" stroke-width="1.6"/>
<text x="1032" y="804" font-size="18" fill="#2563eb" font-weight="400" text-anchor="middle">受控副作用</text>
<rect x="74" y="834" width="348" height="132" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="248" y="872" font-size="24" fill="#111827" font-weight="600" text-anchor="middle">不可变产物仓</text>
<text x="248" y="912" font-size="20" fill="#475569" font-weight="400" text-anchor="middle">证据 / 补丁 / 检查结果</text>
<text x="248" y="948" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">记录基线、哈希与执行状态</text>
<rect x="466" y="834" width="348" height="132" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.6"/>
<text x="640" y="872" font-size="24" fill="#111827" font-weight="600" text-anchor="middle">共享输入快照</text>
<text x="640" y="912" font-size="20" fill="#475569" font-weight="400" text-anchor="middle">代码 / Skill / 调查范围</text>
<text x="640" y="948" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">按版本和权限读取</text>
<rect x="858" y="834" width="348" height="132" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="1032" y="872" font-size="24" fill="#111827" font-weight="600" text-anchor="middle">外部业务系统</text>
<text x="1032" y="912" font-size="20" fill="#475569" font-weight="400" text-anchor="middle">对象授权 / 幂等 / 条件更新</text>
<text x="1032" y="948" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">拒绝过期写入 · 副作用对账</text>
<path d="M 248 966 V 1070 H 308" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="308" y="1020" width="840" height="98" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="728" y="1057" font-size="24" fill="#111827" font-weight="600" text-anchor="middle">集成者：复核基线与产物 → 独立验证 → 授权后提交</text>
<text x="728" y="1092" font-size="20" fill="#6b7280" font-weight="400" text-anchor="middle">唯一集成写目录；消息与摘要不能替代审批或执行结果</text>
<path d="M 55 1193 H 92" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#orange)"/>
<text x="106" y="1200" font-size="18" fill="#6b7280" font-weight="400" text-anchor="start">受限委派</text>
<path d="M 285 1193 H 322" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="336" y="1200" font-size="18" fill="#6b7280" font-weight="400" text-anchor="start">受控调用 / 产物交接</text>
<path d="M 622 1193 H 659" fill="none" stroke="#059669" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#green)"/>
<text x="673" y="1200" font-size="18" fill="#6b7280" font-weight="400" text-anchor="start">共享读取</text>
<text x="886" y="1200" font-size="18" fill="#6b7280" font-weight="400" text-anchor="start">虚线：逻辑归属，需执行层落实</text>
</svg>
