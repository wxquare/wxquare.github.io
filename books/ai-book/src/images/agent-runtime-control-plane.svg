<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img">
<title>Agent Runtime：控制面模块架构</title>
<desc>参考设计 · 维护任务事实，裁决动作并协调执行</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L9 3.5 L0 7 Z" fill="#2563eb"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;fill:#1e293b}.title{font-size:34px;font-weight:700}.subtitle{font-size:20px;fill:#64748b}.section{font-size:23px;font-weight:700}.name{font-size:24px;font-weight:700}.detail{font-size:18px;fill:#475569}.label{font-size:17px;fill:#1d4ed8;font-weight:600}.foot{font-size:18px;fill:#475569}</style>
<rect width="1500" height="980" fill="#fff"/>
<text x="750" y="53" text-anchor="middle" class="title">Agent Runtime：控制面模块架构</text>
<text x="750" y="91" text-anchor="middle" class="subtitle">参考设计 · 维护任务事实，裁决动作并协调执行</text>
<rect x="55" y="125" width="290" height="80" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="200.0" y="163" text-anchor="middle" class="name">用户 / API / 事件</text>
<text x="200.0" y="193" text-anchor="middle" class="detail">请求、回调与触发</text>
<rect x="30" y="245" width="1440" height="445" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="420" y="283" class="section">控制面 · 任务状态与执行条件</text>
<rect x="55" y="330" width="290" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="200.0" y="368" text-anchor="middle" class="name">入口与会话路由</text>
<text x="200.0" y="398" text-anchor="middle" class="detail">身份映射 / Session</text>
<text x="200.0" y="423" text-anchor="middle" class="detail">请求与输入关联</text>
<rect x="420" y="330" width="290" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="565.0" y="368" text-anchor="middle" class="name">任务与生命周期</text>
<text x="565.0" y="398" text-anchor="middle" class="detail">Task / Run / 任务契约</text>
<text x="565.0" y="423" text-anchor="middle" class="detail">等待 / 取消 / 交接</text>
<rect x="785" y="330" width="290" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="930.0" y="368" text-anchor="middle" class="name">规划与循环</text>
<text x="930.0" y="398" text-anchor="middle" class="detail">计划 / Step / 依赖</text>
<text x="930.0" y="423" text-anchor="middle" class="detail">观察与候选动作</text>
<rect x="1150" y="330" width="290" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1295.0" y="368" text-anchor="middle" class="name">策略与人工控制</text>
<text x="1295.0" y="398" text-anchor="middle" class="detail">主体 / 动作 / 资源</text>
<text x="1295.0" y="423" text-anchor="middle" class="detail">裁决 / 审批 / 等待</text>
<rect x="55" y="520" width="290" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="200.0" y="558" text-anchor="middle" class="name">配置与能力注册</text>
<text x="200.0" y="588" text-anchor="middle" class="detail">Model / Tool / Skill</text>
<text x="200.0" y="613" text-anchor="middle" class="detail">配置、Schema 与版本</text>
<rect x="420" y="520" width="290" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="565.0" y="558" text-anchor="middle" class="name">上下文与记忆策略</text>
<text x="565.0" y="588" text-anchor="middle" class="detail">证据选择 / 能力过滤</text>
<text x="565.0" y="613" text-anchor="middle" class="detail">记忆读写与访问范围</text>
<rect x="785" y="520" width="290" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="930.0" y="558" text-anchor="middle" class="name">状态与恢复管理</text>
<text x="930.0" y="588" text-anchor="middle" class="detail">条件提交 / 状态版本</text>
<text x="930.0" y="613" text-anchor="middle" class="detail">Event / Checkpoint</text>
<rect x="1150" y="520" width="290" height="120" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1295.0" y="558" text-anchor="middle" class="name">调度与执行权</text>
<text x="1295.0" y="588" text-anchor="middle" class="detail">依赖就绪 / 分配</text>
<text x="1295.0" y="613" text-anchor="middle" class="detail">租约 / 执行代次</text>
<path d="M200 205 L200 330" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="204.0" y="268" width="62" height="25" rx="5" fill="#fff"/>
<text x="235" y="286" text-anchor="middle" class="label">受理</text>
<path d="M345 390 L420 390" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="355.0" y="353" width="54" height="25" rx="5" fill="#fff"/>
<text x="382" y="371" text-anchor="middle" class="label">请求</text>
<path d="M710 390 L785 390" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="720.0" y="353" width="54" height="25" rx="5" fill="#fff"/>
<text x="747" y="371" text-anchor="middle" class="label">契约</text>
<path d="M1075 390 L1150 390" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="1085.0" y="353" width="54" height="25" rx="5" fill="#fff"/>
<text x="1112" y="371" text-anchor="middle" class="label">提议</text>
<path d="M1295 450 L1295 520" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="1304.0" y="473" width="54" height="25" rx="5" fill="#fff"/>
<text x="1331" y="491" text-anchor="middle" class="label">裁决</text>
<rect x="785" y="755" width="290" height="110" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="930.0" y="793" text-anchor="middle" class="name">状态与事件存储</text>
<text x="930.0" y="823" text-anchor="middle" class="detail">任务状态 / 事件</text>
<text x="930.0" y="848" text-anchor="middle" class="detail">Checkpoint / Outbox</text>
<rect x="1150" y="755" width="290" height="110" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="1295.0" y="793" text-anchor="middle" class="name">执行面 / Worker</text>
<text x="1295.0" y="823" text-anchor="middle" class="detail">受控 Step</text>
<text x="1295.0" y="848" text-anchor="middle" class="detail">返回观察与结果提案</text>
<path d="M930 640 L930 755" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="936.0" y="687" width="54" height="25" rx="5" fill="#fff"/>
<text x="963" y="705" text-anchor="middle" class="label">提交</text>
<path d="M1295 640 L1295 755" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="1301.0" y="687" width="54" height="25" rx="5" fill="#fff"/>
<text x="1328" y="705" text-anchor="middle" class="label">派发</text>
<rect x="55" y="755" width="655" height="110" rx="14" fill="#fff" stroke="#d1d5db" stroke-dasharray="6 4"/>
<text x="80" y="792" class="section">共享约束与事实来源</text>
<text x="80" y="824" class="detail">配置、上下文策略和预算贯穿各模块；Worker 的观察</text>
<text x="80" y="849" class="detail">通过状态接口校验后提交，不直接改写全局终态。</text>
<text x="750" y="930" text-anchor="middle" class="foot">箭头展示典型协作关系；方框是逻辑职责，可合并在同一进程。</text>
</svg>
