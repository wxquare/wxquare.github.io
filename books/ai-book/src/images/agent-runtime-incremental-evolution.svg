<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1200" viewBox="0 0 1280 1200" role="img" aria-labelledby="title desc">
<title id="title">Agent Runtime 从最小闭环按业务压力逐步演进</title>
<desc id="desc">主线从单进程最小闭环到受控工具，再按长任务需要增加持久恢复。业务写入、并发隔离和专业分工是按需扩展，阶段可组合，无须全部建设。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
<rect x="0" y="0" width="1280" height="1200" rx="18" fill="white" stroke="white" stroke-width="1.5"/>
<text x="640" y="57" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="600" fill="#1e293b">Agent Runtime：从最小闭环逐步演进</text>
<text x="640" y="96" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#64748b">以企业知识与工单助手为例 · 由业务压力触发能力增量</text>
<rect x="60" y="140" width="760" height="159" rx="18" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="178" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="600" fill="#1e293b">起点：单进程最小闭环</text>
<text x="440.0" y="217" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#475569">输入与任务范围 → 受限模型调用 → 结果检查 → 返回</text>
<text x="440.0" y="248" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#475569">固定上下文 · 身份与可见范围 · 超时 / 预算 / 取消 · 基础 Trace</text>
<path d="M440 299 V383" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="320" y="328" width="240" height="32" rx="18" fill="white" stroke="white" stroke-width="1.5"/>
<text x="440" y="350" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#64748b">需要实时证据与多步查询</text>
<rect x="60" y="383" width="760" height="159" rx="18" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="421" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="600" fill="#1e293b">受控工具 Runtime</text>
<text x="440.0" y="460" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#475569">按观察选择检索与业务只读工具，保留最大轮数与停止条件</text>
<text x="440.0" y="491" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#475569">补齐 Tool Registry、Schema、逐动作授权与结构化 Observation</text>
<path d="M440 542 V649" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="280" y="582" width="320" height="32" rx="18" fill="white" stroke="white" stroke-width="1.5"/>
<text x="440" y="604" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#64748b">任务跨请求、等待审批或执行中断</text>
<rect x="60" y="649" width="760" height="159" rx="18" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="687" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="600" fill="#1e293b">持久化任务 Runtime</text>
<text x="440.0" y="726" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#475569">任务状态与外部动作进度可以保存、核对和恢复</text>
<text x="440.0" y="757" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#475569">补齐状态机、Checkpoint、幂等、审批等待与恢复协议</text>
<path d="M820 462 H900" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
<rect x="900" y="383" width="330" height="211" rx="18" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1065.0" y="421" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="600" fill="#1e293b">按需：业务写入</text>
<text x="1065.0" y="460" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#475569">从建议升级为创建工单</text>
<text x="1065.0" y="491" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#475569">补齐审批与最小权限</text>
<text x="1065.0" y="522" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#475569">幂等键、动作回执</text>
<text x="1065.0" y="553" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="400" fill="#475569">失败对账与补偿路径</text>
<rect x="790" y="328" width="140" height="32" rx="18" fill="white" stroke="white" stroke-width="1.5"/>
<text x="860" y="350" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#64748b">需产生副作用</text>
<rect x="60" y="877" width="1170" height="218" rx="18" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="645" y="917" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="600" fill="#1e293b">按需：并发、多租户与专业分工</text>
<text x="645" y="956" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#1e293b">共享资源或吞吐出现压力 → 队列、Worker、租约、隔离、配额与根预算</text>
<text x="645" y="993" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#1e293b">确有独立专业任务 → 再加入 Handoff、并行子任务与结果汇总</text>
<text x="645" y="1044" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#64748b">可从前述任一阶段扩展；持久化、写入能力与分布式部署可以独立选择</text>
<text x="645" y="1151" text-anchor="middle" font-family="Helvetica Neue,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#64748b">每一步都保留权限、预算、验证与观测底线；能满足目标的阶段就是可交付版本</text>
</svg>
