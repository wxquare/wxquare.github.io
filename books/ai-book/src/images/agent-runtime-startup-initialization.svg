<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1480" viewBox="0 0 1280 1480" role="img" aria-labelledby="title desc">
<title id="title">Agent Runtime 启动与初始化</title>
<desc id="desc">启动依次加载配置、初始化基础设施、注册能力、加载规则并检查依赖；必需依赖失败则未就绪，可选依赖失败则禁用能力，发布可用能力后等待请求。任务身份与上下文在请求进入后装配。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
<style>text{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1e293b} .sub{fill:#64748b}</style>
<rect width="1280" height="1480" fill="white"/>
<text x="640" y="57" text-anchor="middle" font-size="32" font-weight="600">Agent Runtime：启动与初始化</text>
<text x="640" y="94" text-anchor="middle" font-size="20" font-weight="400" style="fill:#64748b">从进程启动到 Ready · 不包含每次 Task / Run 的装配</text>
<rect x="400" y="132" width="480" height="98" rx="16" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="640.0" y="167" text-anchor="middle" font-size="23" font-weight="600">01  加载配置与版本</text>
<text x="640.0" y="197" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">读取部署配置、版本清单与环境要求</text>
<path d="M640 230 V270" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="400" y="270" width="480" height="98" rx="16" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="640.0" y="305" text-anchor="middle" font-size="23" font-weight="600">02  初始化基础设施</text>
<text x="640.0" y="335" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">状态存储、日志、Trace 与指标通道</text>
<path d="M640 368 V408" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="400" y="408" width="480" height="98" rx="16" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="640.0" y="443" text-anchor="middle" font-size="23" font-weight="600">03  注册模型、工具与 Skill</text>
<text x="640.0" y="473" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">同时建立数据源目录与适配器描述</text>
<path d="M640 506 V546" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="400" y="546" width="480" height="98" rx="16" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="640.0" y="581" text-anchor="middle" font-size="23" font-weight="600">04  加载策略与验收规则</text>
<text x="640.0" y="611" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">默认权限、预算模板、Verifier 配置</text>
<path d="M640 644 V684" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="400" y="684" width="480" height="98" rx="16" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="640.0" y="719" text-anchor="middle" font-size="23" font-weight="600">05  检查依赖与能力契约</text>
<text x="640.0" y="749" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">校验 Schema、配置及必需依赖可达性</text>
<path d="M640 782 V816" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M640 816 L790 878 L640 940 L490 878 Z" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="640" y="886" text-anchor="middle" font-size="23" font-weight="600">检查结果</text>
<rect x="40" y="823" width="300" height="110" rx="16" fill="#fff1f2" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="190.0" y="858" text-anchor="middle" font-size="23" font-weight="600">必需依赖失败</text>
<text x="190.0" y="888" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">Not Ready / 启动失败</text>
<text x="190.0" y="915" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">修复后重新检查</text>
<rect x="940" y="823" width="300" height="110" rx="16" fill="#fffbeb" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1090.0" y="858" text-anchor="middle" font-size="23" font-weight="600">仅可选依赖失败</text>
<text x="1090.0" y="888" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">禁用对应能力</text>
<text x="1090.0" y="915" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">记录降级原因</text>
<path d="M490 878 H340" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="385.0" y="841" width="58" height="29" rx="16" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<text x="414" y="861" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">阻断</text>
<path d="M790 878 H940" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="836.0" y="841" width="58" height="29" rx="16" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<text x="865" y="861" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">降级</text>
<path d="M640 940 V1020" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="592.0" y="965" width="96" height="29" rx="16" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<text x="640" y="985" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">全部通过</text>
<rect x="400" y="1020" width="480" height="105" rx="16" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="640.0" y="1055" text-anchor="middle" font-size="23" font-weight="600">06  发布可用能力 · Ready</text>
<text x="640.0" y="1085" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">公布健康能力集合与就绪状态</text>
<path d="M1090 933 V1072 H880" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M640 1125 V1172" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="400" y="1172" width="480" height="86" rx="16" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="640.0" y="1207" text-anchor="middle" font-size="23" font-weight="600">07  等待用户请求或事件</text>
<path d="M640 1258 V1332" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="240" y="1332" width="800" height="104" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="640" y="1369" text-anchor="middle" font-size="23" font-weight="600">请求进入后：按 Task / Run 装配（14.2.2）</text>
<text x="640" y="1405" text-anchor="middle" font-size="20" font-weight="400" style="fill:#475569">身份授权 → 任务契约 → 工作区与上下文 → 本次预算</text>
<rect x="40" y="390" width="300" height="209" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="190" y="430" text-anchor="middle" font-size="23" font-weight="600">注册 ≠ 全部连接</text>
<text x="190" y="467" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">可选模型与数据源可延迟连接</text>
<text x="190" y="497" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">按需建立 MCP / 业务连接</text>
<text x="190" y="527" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">首次使用时再校验与授权</text>
<text x="190" y="557" text-anchor="middle" font-size="18" font-weight="400" style="fill:#475569">能力不可用时明确返回原因</text>
</svg>
