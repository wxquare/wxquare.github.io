<text x="112" y="157" font-size="24" fill="#111827" font-weight="600" text-anchor="start">编写与接入</text>
<text x="1216" y="157" font-size="17" fill="#6b7280" font-weight="400" text-anchor="end">开发阶段 · 连接入口先由 Host 配置</text>
