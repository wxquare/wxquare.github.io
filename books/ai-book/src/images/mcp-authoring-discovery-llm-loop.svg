<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1640" viewBox="0 0 1280 1640" role="img" aria-labelledby="title desc">
<title id="title">MCP Server 编写、工具发现与 LLM 调用闭环</title>
<desc id="desc">MCP 2026-07-28 三阶段架构图：开发者定义工具并注册 handler 后运行 Server；Host 内的 MCP Client 按需通过 server/discover 发现能力，通过 tools/list 获取工具定义，逐请求携带版本元数据；Host 将工具 Schema 提供给 LLM，校验调用提案后经 tools/call 执行，处理结果后回填模型上下文并回答用户。</desc>
<style>text { font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; } .mono { font-family: Menlo, Consolas, monospace; }</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
