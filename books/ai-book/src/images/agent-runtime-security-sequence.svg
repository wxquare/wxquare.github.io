<rect x="390.0" y="1475" width="160" height="24" rx="3" fill="#ffffff"/>
<text x="470.0" y="1493" text-anchor="middle" class="msg">对外发送单独裁决</text>
<line x1="650" y1="1570" x2="290" y2="1570" stroke="#c2410c" stroke-width="2" marker-end="url(#orange)"/>
