<text x="560.0" y="838" text-anchor="middle" class="msg">仅允许后派发</text>
<line x1="830" y1="945" x2="1010" y2="945" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="839.0" y="915" width="162" height="24" rx="3" fill="#ffffff"/>
<text x="920.0" y="933" text-anchor="middle" class="msg">工具调用及可信上下文</text>
<line x1="1010" y1="1035" x2="1190" y2="1035" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="1019.0" y="1005" width="162" height="24" rx="3" fill="#ffffff"/>
<text x="1100.0" y="1023" text-anchor="middle" class="msg">受限凭证与目标查询</text>
<line x1="1190" y1="1120" x2="1010" y2="1120" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#gray)"/>
<rect x="1019.0" y="1090" width="162" height="24" rx="3" fill="#ffffff"/>
<text x="1100.0" y="1108" text-anchor="middle" class="msg">业务结果 / 回执</text>
<line x1="1010" y1="1205" x2="830" y2="1205" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#gray)"/>
<rect x="840.0" y="1175" width="160" height="24" rx="3" fill="#ffffff"/>
<text x="920.0" y="1193" text-anchor="middle" class="msg">过滤后的工具结果</text>
<line x1="830" y1="1290" x2="290" y2="1290" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#gray)"/>
<rect x="426.0" y="1260" width="268" height="24" rx="3" fill="#ffffff"/>
<text x="560.0" y="1278" text-anchor="middle" class="msg">观察 / 错误 / 效果证据</text>
<line x1="290" y1="1370" x2="470" y2="1370" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="309.0" y="1340" width="142" height="24" rx="3" fill="#ffffff"/>
<text x="380.0" y="1358" text-anchor="middle" class="msg">保留来源的观察</text>
<line x1="470" y1="1440" x2="290" y2="1440" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#gray)"/>
