<text x="380.0" y="603" text-anchor="middle" class="msg">展示绑定的计划并请求审批</text>
<line x1="110" y1="685" x2="650" y2="685" stroke="#c2410c" stroke-width="2" marker-end="url(#orange)"/>
<rect x="273.0" y="655" width="214" height="24" rx="3" fill="#ffffff"/>
<text x="380.0" y="673" text-anchor="middle" class="msg">有权主体批准 / 拒绝</text>
<line x1="650" y1="760" x2="290" y2="760" stroke="#c2410c" stroke-width="2" marker-end="url(#orange)"/>
<rect x="354.0" y="730" width="232" height="24" rx="3" fill="#ffffff"/>
<text x="470.0" y="748" text-anchor="middle" class="msg">允许 / 拒绝 / 等待</text>
