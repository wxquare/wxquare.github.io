<text x="830.0" y="1628" text-anchor="middle" class="msg">受控提交 / 内容与目标</text>
<line x1="1370" y1="1715" x2="110" y2="1715" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="696.0" y="1685" width="88" height="24" rx="3" fill="#ffffff"/>
<text x="740.0" y="1703" text-anchor="middle" class="msg">结果交付</text>
<rect x="1470" y="207" width="530" height="87" rx="8" fill="#f8fafc" stroke="#d1d5db"/>
<text x="1488" y="232" class="noteTitle">任务受理</text>
<text x="1488" y="257" class="note">认证调用者，绑定任务、租户与权限范围</text>
<text x="1488" y="281" class="note">缺少可信身份或范围时拒绝访问</text>
<rect x="1470" y="304" width="530" height="87" rx="8" fill="#f8fafc" stroke="#d1d5db"/>
<text x="1488" y="329" class="noteTitle">上下文与模型</text>
<text x="1488" y="354" class="note">检查读取范围、脱敏并保留来源</text>
<text x="1488" y="378" class="note">日志和工具结果是数据，不产生授权</text>
<rect x="1470" y="407" width="530" height="87" rx="8" fill="#f8fafc" stroke="#d1d5db"/>
<text x="1488" y="432" class="noteTitle">动作提案与裁决</text>
<text x="1488" y="457" class="note">校验工具、实际参数、目标及副作用</text>
<text x="1488" y="481" class="note">提示词和模型自报身份不能放行</text>
<rect x="1470" y="538" width="530" height="87" rx="8" fill="#f8fafc" stroke="#d1d5db"/>
<text x="1488" y="563" class="noteTitle">人工审批与恢复</text>
<text x="1488" y="588" class="note">批准绑定摘要、版本和期限；持久等待并释放 Worker</text>
<text x="1488" y="612" class="note">批准后重新认领并复核；拒绝或过期则停止</text>
<rect x="1470" y="806" width="530" height="87" rx="8" fill="#f8fafc" stroke="#d1d5db"/>
<text x="1488" y="831" class="noteTitle">派发与隔离</text>
<text x="1488" y="856" class="note">本地进程限制文件、凭证、网络及句柄</text>
<text x="1488" y="880" class="note">写操作先完成 C4 派发记账，再发送</text>
<rect x="1470" y="902" width="530" height="87" rx="8" fill="#f8fafc" stroke="#d1d5db"/>
<text x="1488" y="927" class="noteTitle">工具服务与资源端</text>
<text x="1488" y="952" class="note">服务端按可信任务范围逐次授权实际目标</text>
<text x="1488" y="976" class="note">下游独立检查身份、权限和条件写入</text>
<rect x="1470" y="1089" width="530" height="87" rx="8" fill="#f8fafc" stroke="#d1d5db"/>
<text x="1488" y="1114" class="noteTitle">观察与循环</text>
<text x="1488" y="1139" class="note">返回前过滤、脱敏，保留来源与错误</text>
<text x="1488" y="1163" class="note">继续调用时重新裁决；未知效果先核验</text>
<rect x="1470" y="1332" width="530" height="87" rx="8" fill="#f8fafc" stroke="#d1d5db"/>
<text x="1488" y="1357" class="noteTitle">输出与交付</text>
<text x="1488" y="1382" class="note">读取权限不自动授予发送权限</text>
<text x="1488" y="1406" class="note">校验接收人、内容与外发范围</text>
<rect x="1470" y="1531" width="530" height="87" rx="8" fill="#f8fafc" stroke="#d1d5db"/>
<text x="1488" y="1556" class="noteTitle">终态与审计</text>
<text x="1488" y="1581" class="note">记录主体、策略、批准、操作与结果</text>
<text x="1488" y="1605" class="note">凭证和敏感原文不进入普通审计日志</text>
<line x1="45" y1="1790" x2="95" y2="1790" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/><text x="105" y="1796" class="sub">请求 / 派发</text>
<line x1="270" y1="1790" x2="320" y2="1790" stroke="#c2410c" stroke-width="2" marker-end="url(#orange)"/><text x="330" y="1796" class="sub">授权 / 审批</text>
<line x1="500" y1="1790" x2="550" y2="1790" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#gray)"/><text x="560" y="1796" class="sub">提案 / 结果</text>
<text x="810" y="1796" class="sub">图示 MCP 路径；本地 Shell 与其他工具须分别落实自身隔离与授权。</text>
</svg>
