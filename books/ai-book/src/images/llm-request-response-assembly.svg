<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1390" viewBox="0 0 1680 1390" role="img" aria-labelledby="title desc">
<title id="title">LLM 请求组装与响应闭环</title>
<desc id="desc">应用读取系统提示、用户任务、受信 Skill、知识库片段、Memory、历史与工作区、工具注册表，将内容映射到 Responses 的 input、tools、text.format。模型生成工具调用时，Runtime 校验执行并按 call_id 追加真实观察进入下一轮；生成最终消息时，应用校验事实后交付结构化结果与客服草稿。</desc>
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#111827} .title{font-size:32px;font-weight:600}.heading{font-size:23px;font-weight:600}.label{font-size:21px;font-weight:600}.body{font-size:19px}.small{font-size:17px;fill:#6b7280}.code{font-family:Menlo,Consolas,monospace;font-size:21px;fill:#1d4ed8}</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#059669"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7c3aed"/></marker>
</defs>
<rect width="1680" height="1390" fill="#ffffff"/>
<text x="40" y="55" class="title" text-anchor="start">LLM Request → Response：材料在应用侧组装，观察在循环中更新</text>
<text x="40" y="93" class="body" text-anchor="start">贯穿案例：退款核查 · 申请 150 元 · 当前资金上限 130 元 · 缺少质量凭证</text>
<text x="40" y="148" class="heading" text-anchor="start">应用管理的来源</text>
<rect x="490" y="150" width="440" height="970" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<text x="510" y="181" class="heading" text-anchor="start">Context Builder / Adapter</text>
<text x="510" y="1100" class="body" text-anchor="start">text.format + 生成预算</text>
<rect x="40" y="190" width="330" height="100" rx="10" fill="#eff6ff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="58" y="219" class="label" text-anchor="start">System Prompt</text>
<text x="58" y="248" class="body" text-anchor="start">职责、事实使用原则</text>
<text x="58" y="273" class="small" text-anchor="start">只读核查，不提交退款</text>
<rect x="510" y="198" width="400" height="84" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="528" y="229" class="code" text-anchor="start">input[0] · system</text>
<text x="528" y="258" class="small" text-anchor="start">应用基础指令</text>
<path d="M 370 240 L 490 240" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="386" y="212" width="88" height="31" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="430.0" y="233" class="small" text-anchor="middle">指令</text>
<rect x="40" y="318" width="330" height="100" rx="10" fill="#eff6ff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="58" y="347" class="label" text-anchor="start">User Input</text>
<text x="58" y="376" class="body" text-anchor="start">订单 O-2048 / 商品 L1</text>
<text x="58" y="401" class="small" text-anchor="start">申请 150 元，交付客服草稿</text>
<rect x="510" y="326" width="400" height="84" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="528" y="357" class="code" text-anchor="start">input[2] · user</text>
<text x="528" y="386" class="small" text-anchor="start">用户当前任务与约束</text>
<path d="M 370 368 L 490 368" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="386" y="340" width="88" height="31" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="430.0" y="361" class="small" text-anchor="middle">任务</text>
<rect x="40" y="446" width="330" height="100" rx="10" fill="#fff7ed" stroke="#d1d5db" stroke-width="1.6"/>
<text x="58" y="475" class="label" text-anchor="start">Trusted Skill</text>
<text x="58" y="504" class="body" text-anchor="start">refund_assessment@1.2</text>
<text x="58" y="529" class="small" text-anchor="start">选中并加载受信方法正文</text>
<rect x="510" y="454" width="400" height="84" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="528" y="485" class="code" text-anchor="start">input[1] · developer</text>
<text x="528" y="514" class="small" text-anchor="start">核查步骤、空值与停止条件</text>
<path d="M 370 496 L 490 496" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="386" y="468" width="88" height="31" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="430.0" y="489" class="small" text-anchor="middle">方法</text>
<rect x="40" y="574" width="330" height="100" rx="10" fill="#f0fdf4" stroke="#d1d5db" stroke-width="1.6"/>
<text x="58" y="603" class="label" text-anchor="start">知识库 / RAG</text>
<text x="58" y="632" class="body" text-anchor="start">权限过滤，检索相关指南</text>
<text x="58" y="657" class="small" text-anchor="start">保留来源、版本、适用范围</text>
<rect x="510" y="582" width="400" height="84" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="528" y="613" class="code" text-anchor="start">input[3] · content</text>
<text x="528" y="642" class="small" text-anchor="start">knowledge_context 文本块</text>
<path d="M 370 624 L 490 624" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
<rect x="386" y="596" width="88" height="31" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="430.0" y="617" class="small" text-anchor="middle">片段</text>
<rect x="40" y="702" width="330" height="100" rx="10" fill="#f0fdf4" stroke="#d1d5db" stroke-width="1.6"/>
<text x="58" y="731" class="label" text-anchor="start">Memory</text>
<text x="58" y="760" class="body" text-anchor="start">按用户与作用域读取偏好</text>
<text x="58" y="785" class="small" text-anchor="start">简体中文、简短表达</text>
<rect x="510" y="710" width="400" height="84" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="528" y="741" class="code" text-anchor="start">input[3] · content</text>
<text x="528" y="770" class="small" text-anchor="start">memory 文本块；不是业务事实</text>
<path d="M 370 752 L 490 752" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
<rect x="386" y="724" width="88" height="31" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="430.0" y="745" class="small" text-anchor="middle">偏好</text>
<rect x="40" y="830" width="330" height="100" rx="10" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.6"/>
<text x="58" y="859" class="label" text-anchor="start">History / Workspace</text>
<text x="58" y="888" class="body" text-anchor="start">旧结论尚未核实</text>
<text x="58" y="913" class="small" text-anchor="start">金额单位、商品行数据语义</text>
<rect x="510" y="838" width="400" height="84" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="528" y="869" class="code" text-anchor="start">input[3] · content</text>
<text x="528" y="898" class="small" text-anchor="start">history / workspace_context</text>
<path d="M 370 880 L 490 880" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="386" y="852" width="88" height="31" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="430.0" y="873" class="small" text-anchor="middle">状态</text>
<rect x="40" y="958" width="330" height="100" rx="10" fill="#faf5ff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="58" y="987" class="label" text-anchor="start">Tool Registry</text>
<text x="58" y="1016" class="body" text-anchor="start">三个只读函数及参数定义</text>
<text x="58" y="1041" class="small" text-anchor="start">实现与凭据留在应用侧</text>
<rect x="510" y="966" width="400" height="84" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.6"/>
<text x="528" y="997" class="code" text-anchor="start">tools · function[]</text>
<text x="528" y="1026" class="small" text-anchor="start">名称、描述、参数 JSON Schema</text>
<path d="M 370 1008 L 490 1008" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<rect x="386" y="980" width="88" height="31" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="430.0" y="1001" class="small" text-anchor="middle">Schema</text>
<rect x="1040" y="200" width="460" height="150" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="1064" y="238" class="heading" text-anchor="start">LLM / Responses API</text>
<text x="1064" y="273" class="body" text-anchor="start">消费当前 input、tools 与输出约束</text>
<text x="1064" y="309" class="body" text-anchor="start">生成工具调用，或生成最终消息</text>
<path d="M 930 275 L 1040 275" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
<rect x="942" y="243" width="86" height="31" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="985.0" y="264" class="small" text-anchor="middle">request</text>
<path d="M 1270 350 L 1270 450" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
<rect x="1180" y="383" width="180" height="31" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="1270.0" y="404" class="small" text-anchor="middle">推理 / 生成</text>
<rect x="1040" y="450" width="460" height="160" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6"/>
<text x="1064" y="488" class="heading" text-anchor="start">Model Response · output[]</text>
<text x="1064" y="527" class="body" text-anchor="start">A  function_call：调用提案</text>
<text x="1064" y="564" class="body" text-anchor="start">B  message：最终文本 / JSON</text>
<text x="1064" y="592" class="small" text-anchor="start">completed 只表示这一轮生成完成</text>
<path d="M 1200 610 L 1200 750" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
<rect x="1095" y="667" width="210" height="31" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="1200.0" y="688" class="small" text-anchor="middle">A · 完整调用参数</text>
<rect x="1040" y="750" width="460" height="150" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
<text x="1064" y="790" class="heading" text-anchor="start">Tool Runtime</text>
<text x="1064" y="827" class="body" text-anchor="start">校验 Schema、权限与对象 → 执行</text>
<text x="1064" y="862" class="body" text-anchor="start">订单 / 账务 / 适用政策；保留证据</text>
<path d="M 1040 825 C 1000 825 990 840 990 880 L 990 1200 Q 990 1230 960 1230 L 730 1230 Q 705 1230 705 1205 L 705 1120" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
<rect x="735" y="1215" width="230" height="31" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="850" y="1236" class="small" text-anchor="middle">工具结果 + call_id</text>
<text x="684" y="1267" class="small" text-anchor="start">保留 output[]，追加 function_call_output</text>
<path d="M 1500 530 L 1570 530 L 1570 1110 L 1500 1110" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
<rect x="1508" y="940" width="130" height="31" rx="4" fill="#ffffff" opacity="0.97"/>
<text x="1573.0" y="961" class="small" text-anchor="middle">B · 最终消息</text>
<rect x="1040" y="1030" width="460" height="160" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.6"/>
<text x="1064" y="1070" class="heading" text-anchor="start">校验 → 渲染 → 交付</text>
<text x="1064" y="1110" class="body" text-anchor="start">重算 18000 − 3000 − 2000 = 13000</text>
<text x="1064" y="1148" class="body" text-anchor="start">核对凭证缺项、证据与业务语义</text>
<text x="1064" y="1178" class="small" text-anchor="start">结构化核查结果 + 客服草稿；未执行退款</text>
<path d="M 40 1320 L 80 1320" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="94" y="1326" class="small" text-anchor="start">请求 / 响应与协议映射</text>
<path d="M 420 1320 L 460 1320" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="474" y="1326" class="small" text-anchor="start">知识与记忆读取</text>
<path d="M 750 1320 L 790 1320" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
<text x="804" y="1326" class="small" text-anchor="start">工具观察回填循环</text>
<text x="40" y="1366" class="body" text-anchor="start">边界：Skill、知识库、Memory 没有本例原生顶层字段；模型不直接读取这些库；Memory 写回需独立门控。</text>
</svg>
