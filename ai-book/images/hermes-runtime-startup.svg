<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1340" viewBox="0 0 1440 1340" role="img" aria-labelledby="title desc">
<title id="title">Hermes 启动：先让共享 Runtime 就绪，再接入会话</title><desc id="desc">冷启动职责阶段图 · 热连接复用已有 Gateway · 恢复、预热与平台连接可重叠</desc>
<style>text{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#111827} .sub{fill:#6b7280}</style>
<defs>
<marker id="blue" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 4 L 0 8 Z" fill="#2563eb"/></marker>
<marker id="green" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 4 L 0 8 Z" fill="#059669"/></marker>
<marker id="purple" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 4 L 0 8 Z" fill="#7c3aed"/></marker>
<marker id="orange" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 4 L 0 8 Z" fill="#ea580c"/></marker>
<marker id="gray" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 4 L 0 8 Z" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="1440" height="1340" rx="0" fill="#ffffff" stroke="none" stroke-width="1.6"/>
<text x="48" y="53" font-size="32" fill="#111827" style="fill:#111827" font-weight="600" text-anchor="start">Hermes 启动：先让共享 Runtime 就绪，再接入会话</text>
<text x="48" y="88" font-size="19" fill="#6b7280" style="fill:#6b7280" font-weight="400" text-anchor="start">冷启动职责阶段图 · 热连接复用已有 Gateway · 恢复、预热与平台连接可重叠</text>
<text x="48" y="128" font-size="23" fill="#111827" style="fill:#111827" font-weight="600" text-anchor="start">前端接入路径</text>
<text x="600" y="128" font-size="23" fill="#111827" style="fill:#111827" font-weight="600" text-anchor="start">Gateway 冷启动主线</text>
<rect x="48" y="158" width="400" height="104" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="68" y="192" font-size="22" fill="#111827" style="fill:#111827" font-weight="600" text-anchor="start">启动 hermes / hermes chat</text>
<text x="68" y="222" font-size="19" fill="#6b7280" style="fill:#6b7280" font-weight="400" text-anchor="start">console script → main</text>
<rect x="48" y="344" width="400" height="104" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="68" y="378" font-size="22" fill="#111827" style="fill:#111827" font-weight="600" text-anchor="start">选择 profile / 加载环境</text>
<text x="68" y="408" font-size="19" fill="#6b7280" style="fill:#6b7280" font-weight="400" text-anchor="start">再解析配置与会话启动参数</text>
<rect x="48" y="530" width="400" height="104" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="68" y="564" font-size="22" fill="#111827" style="fill:#111827" font-weight="600" text-anchor="start">连接共享 Gateway</text>
<text x="68" y="594" font-size="19" fill="#6b7280" style="fill:#6b7280" font-weight="400" text-anchor="start">已有实例：连接；无实例：启动</text>
<rect x="48" y="716" width="400" height="104" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="68" y="750" font-size="22" fill="#111827" style="fill:#111827" font-weight="600" text-anchor="start">等待接入与运行状态</text>
<text x="68" y="780" font-size="19" fill="#6b7280" style="fill:#6b7280" font-weight="400" text-anchor="start">认证 / attach · 不在前端执行工具</text>
<rect x="48" y="1008" width="400" height="104" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="68" y="1042" font-size="22" fill="#111827" style="fill:#111827" font-weight="600" text-anchor="start">创建或恢复 session</text>
<text x="68" y="1072" font-size="19" fill="#6b7280" style="fill:#6b7280" font-weight="400" text-anchor="start">采用 Gateway 返回的 session ID</text>
<path d="M 248 262 L 248 344" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/>
<path d="M 248 448 L 248 530" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/>
<path d="M 248 634 L 248 716" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/>
<path d="M 248 820 L 248 1008" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/>
<rect x="600" y="158" width="792" height="104" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="620" y="192" font-size="24" fill="#111827" style="fill:#111827" font-weight="600" text-anchor="start">1  配置与运行所有权</text>
<text x="620" y="222" font-size="19" fill="#6b7280" style="fill:#6b7280" font-weight="400" text-anchor="start">profile homes · 现有实例检查 · 锁 / PID</text>
<rect x="600" y="328" width="792" height="104" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="620" y="362" font-size="24" fill="#111827" style="fill:#111827" font-weight="600" text-anchor="start">2  建立共享会话运行时</text>
<text x="620" y="392" font-size="19" fill="#6b7280" style="fill:#6b7280" font-weight="400" text-anchor="start">GatewayRunner · SessionAuthorities · DB / tickets</text>
<rect x="600" y="498" width="792" height="104" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="620" y="532" font-size="24" fill="#111827" style="fill:#111827" font-weight="600" text-anchor="start">3  接通控制与请求端点</text>
<text x="620" y="562" font-size="19" fill="#6b7280" style="fill:#6b7280" font-weight="400" text-anchor="start">停止 / 重启处理 · control listener · runtime API</text>
<rect x="600" y="668" width="792" height="104" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="620" y="702" font-size="24" fill="#111827" style="fill:#111827" font-weight="600" text-anchor="start">4  恢复、预热与平台连接</text>
<text x="620" y="732" font-size="19" fill="#6b7280" style="fill:#6b7280" font-weight="400" text-anchor="start">恢复期间入站门控 · 有界等待 · degraded 判断</text>
<rect x="600" y="838" width="792" height="104" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.6"/>
<text x="620" y="872" font-size="24" fill="#111827" style="fill:#111827" font-weight="600" text-anchor="start">5  完成路由与后台服务</text>
<text x="620" y="902" font-size="19" fill="#6b7280" style="fill:#6b7280" font-weight="400" text-anchor="start">Delivery / Hooks / Watchers · Cron / Housekeeping</text>
<rect x="600" y="1008" width="792" height="104" rx="12" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1.6"/>
<text x="620" y="1042" font-size="24" fill="#111827" style="fill:#111827" font-weight="600" text-anchor="start">6  发布 READY，进入服务</text>
<text x="620" y="1072" font-size="19" fill="#6b7280" style="fill:#6b7280" font-weight="400" text-anchor="start">结合 served profiles / degraded 解读就绪范围</text>
<path d="M 996 262 L 996 328" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/>
<path d="M 996 432 L 996 498" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/>
<path d="M 996 602 L 996 668" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/>
<path d="M 996 772 L 996 838" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/>
<path d="M 996 942 L 996 1008" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/>
<path d="M 448 580 L 520 580 L 520 210 L 600 210" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#orange)"/>
<rect x="485.0" y="283" width="70" height="28" rx="3" fill="#ffffff" stroke="none" stroke-width="1.6"/>
<text x="520" y="300" font-size="18" fill="#ea580c" style="fill:#ea580c" font-weight="400" text-anchor="middle">冷启动</text>
<path d="M 600 1060 L 448 1060" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#green)"/>
<rect x="489.0" y="1031" width="70" height="28" rx="3" fill="#ffffff" stroke="none" stroke-width="1.6"/>
<text x="524" y="1048" font-size="18" fill="#059669" style="fill:#059669" font-weight="400" text-anchor="middle">可接入</text>
<rect x="48" y="1190" width="1344" height="96" rx="12" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.6"/>
<text x="68" y="1224" font-size="24" fill="#111827" style="fill:#111827" font-weight="600" text-anchor="start">首条请求：取得 / 装配执行实例 → 回合准入 → prompt → 模型与工具循环</text>
<text x="68" y="1254" font-size="19" fill="#6b7280" style="fill:#6b7280" font-weight="400" text-anchor="start">READY 不等于已成功调用所有模型、MCP 与工具后端；具体执行见下一张时序图。</text>
<path d="M 248 1112 L 248 1190" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue)"/>
<text x="48" y="1320" font-size="18" fill="#6b7280" style="fill:#6b7280" font-weight="400" text-anchor="start">蓝色：接入与启动主线   橙色：无可用实例时触发启动   绿色：运行时就绪后接入会话</text>
</svg>
