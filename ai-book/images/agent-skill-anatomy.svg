<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="870" viewBox="0 0 1280 870" role="img" aria-labelledby="title desc">
<title id="title">Skill 的组成：发现入口、执行指令与配套资源</title><desc id="desc">Skill 包含必需的 SKILL.md 及可选的脚本、参考资料和资产；不同内容分别负责发现、决策、确定性操作、知识和输出材料。</desc>
<style>text{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<defs>
<marker id="a2563eb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563eb"/></marker>
<marker id="a6b7280" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#6b7280"/></marker>
<marker id="a9333ea" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#9333ea"/></marker>
<marker id="adc2626" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#dc2626"/></marker>
<marker id="a16a34a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#16a34a"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="870" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="55" y="60" font-size="32" fill="#111827" font-weight="600" text-anchor="start">Skill 的组成：发现入口、执行指令与配套资源</text>
<text x="55" y="99" font-size="21" fill="#6b7280" font-weight="400" text-anchor="start">能力包以 SKILL.md 为入口；资源按需要添加，不要求目录齐全。</text>
<rect x="55" y="135" width="1170" height="285" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="85" y="178" font-size="25" fill="#111827" font-weight="600" text-anchor="start">SKILL.md · 必需</text>
<rect x="85" y="200" width="490" height="180" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="330.0" y="235" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">YAML Front Matter</text>
<text x="330.0" y="270" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">name：能力名称</text>
<text x="330.0" y="299" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">description：做什么、何时用</text>
<text x="330.0" y="328" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">作用：让 Agent 发现并选择能力</text>
<rect x="605" y="200" width="590" height="180" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="900.0" y="235" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">Markdown 正文</text>
<text x="900.0" y="270" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">输入 → 步骤 → 分支与失败处理</text>
<text x="900.0" y="299" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">约束、资源入口、输出与验证标准</text>
<text x="900.0" y="328" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">作用：指导 Agent 的执行路径</text>
<path d="M 900 380 V 462 H 250 V 510" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#a2563eb)"/>
<path d="M 900 462 H 640 V 510" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#a2563eb)"/>
<path d="M 900 462 H 1030 V 510" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#a2563eb)"/>
<rect x="491.0" y="440" width="298" height="28" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="640" y="460" font-size="20" fill="#2563eb" font-weight="400" text-anchor="middle">正文声明资源的用途与使用条件</text>
<rect x="85" y="510" width="330" height="175" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="250.0" y="545" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">scripts/ · 可选</text>
<text x="250.0" y="580" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">确定性操作与校验</text>
<text x="250.0" y="609" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">执行脚本，获取必要结果</text>
<text x="250.0" y="638" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">例：check_report.py</text>
<rect x="475" y="510" width="330" height="175" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="640.0" y="545" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">references/ · 可选</text>
<text x="640.0" y="580" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">领域规则与详细说明</text>
<text x="640.0" y="609" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">沿当前任务分支按需读取</text>
<text x="640.0" y="638" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">例：metrics.md</text>
<rect x="865" y="510" width="330" height="175" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="1030.0" y="545" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">assets/ · 可选</text>
<text x="1030.0" y="580" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">模板、图片与输出素材</text>
<text x="1030.0" y="609" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">复制、修改或作为产物输入</text>
<text x="1030.0" y="638" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">例：incident-report.md</text>
<rect x="85" y="735" width="1110" height="80" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="110" y="768" font-size="22" fill="#111827" font-weight="600" text-anchor="start">执行边界：脚本和外部工具仍通过 Tool Runtime 运行。</text>
<text x="110" y="799" font-size="20" fill="#6b7280" font-weight="400" text-anchor="start">Skill 提供方法；参数、权限、审批和沙箱由运行时实施。</text>
</svg>
