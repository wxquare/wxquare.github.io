<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1370" viewBox="0 0 1280 1370" role="img" aria-labelledby="title desc">
<title id="title">五类 Agent 产品形态：用户交互与执行关系对照</title>
<desc id="desc">五条泳道按用户发起、Agent 工作环境、交付与用户介入对照。网页版助手围绕会话和项目，本地 Codex 围绕本地文件与终端，云端 Manus 围绕异步委派任务，业务 Bot 围绕业务单据，Muse 等个人 Agent 围绕个人长期目标。蓝色实线表示任务推进，灰色虚线表示异步推进，紫色回路表示反馈、补充或用户决策。这是本书基于正文所引官方资料归纳的典型交互示意，不是互斥部署分类或内部架构标准。</desc>
