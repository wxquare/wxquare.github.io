<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1460" viewBox="0 0 1280 1460" role="img" aria-labelledby="title desc">
<title id="title">Skill 生命周期：版本发布、更新迭代与退役</title><desc id="desc">具体案例经提炼形成候选版本，测试和审核通过后发布不可变能力包；失败回到修订，运行观测触发新版本迭代、回滚上一稳定版本或废弃迁移并退役。</desc>
<style>text{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style>
<defs>
<marker id="a2563eb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563eb"/></marker>
<marker id="a6b7280" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#6b7280"/></marker>
<marker id="a9333ea" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#9333ea"/></marker>
<marker id="adc2626" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#dc2626"/></marker>
<marker id="a16a34a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#16a34a"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="1460" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="55" y="60" font-size="32" fill="#111827" font-weight="600" text-anchor="start">Skill 生命周期：版本发布、更新迭代与退役</text>
<text x="55" y="99" font-size="21" fill="#6b7280" font-weight="400" text-anchor="start">每次更新都重新经过测试、审核和发布；候选版本与稳定版本分离。</text>
<rect x="70" y="140" width="300" height="110" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="220.0" y="175" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">具体案例</text>
<text x="220.0" y="210" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">输入、成功标准、失败轨迹</text>
<rect x="455" y="140" width="375" height="110" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="642.5" y="175" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">提炼能力</text>
<text x="642.5" y="210" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">适用边界、复用步骤与资源</text>
<path d="M 370 195 H 455" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#a2563eb)"/>
<path d="M 642 250 V 315" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#a2563eb)"/>
<rect x="420" y="315" width="410" height="110" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="625.0" y="350" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">编写候选版本 vNext</text>
<text x="625.0" y="385" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">修改正文、脚本、参考资料与资产</text>
<path d="M 625 425 V 490" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#a2563eb)"/>
<rect x="420" y="490" width="410" height="110" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="625.0" y="525" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">格式校验 + 行为测试</text>
<text x="625.0" y="560" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">检查资源；运行真实任务与回归集</text>
<path d="M 625 600 V 665" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#a2563eb)"/>
<rect x="633.0" y="622" width="54" height="26" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="660" y="640" font-size="18" fill="#2563eb" font-weight="400" text-anchor="middle">通过</text>
<rect x="420" y="665" width="410" height="110" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="625.0" y="700" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">审核</text>
<text x="625.0" y="735" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">检查方法、风险、依赖与验证证据</text>
<path d="M 625 775 V 840" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#a2563eb)"/>
<rect x="633.0" y="797" width="54" height="26" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="660" y="815" font-size="18" fill="#2563eb" font-weight="400" text-anchor="middle">通过</text>
<rect x="420" y="840" width="410" height="110" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="625.0" y="875" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">发布版本 vN</text>
<text x="625.0" y="910" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">不可变能力包 · 限定范围后逐步启用</text>
<path d="M 625 950 V 1015" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#a2563eb)"/>
<rect x="420" y="1015" width="410" height="110" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="625.0" y="1050" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">运行观测</text>
<text x="625.0" y="1085" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">误触发、漏步骤、失败率与依赖变化</text>
<path d="M 420 545 H 375 V 390 H 420" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#adc2626)" stroke-dasharray="7 5"/>
<path d="M 420 720 H 375 V 545" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#adc2626)" stroke-dasharray="7 5"/>
<rect x="142.755" y="506" width="202.49" height="27" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="244" y="525" font-size="19" fill="#dc2626" font-weight="400" text-anchor="middle">测试失败 / 审核退回</text>
<text x="85" y="558" font-size="19" fill="#6b7280" font-weight="400" text-anchor="start">修订候选版本后重测</text>
<path d="M 420 1070 H 350 V 350 H 420" fill="none" stroke="#9333ea" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#a9333ea)" stroke-dasharray="7 5"/>
<rect x="99.67" y="918" width="210.66" height="27" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="205" y="937" font-size="19" fill="#9333ea" font-weight="400" text-anchor="middle">更新迭代 → 下一版本</text>
<text x="70" y="970" font-size="19" fill="#6b7280" font-weight="400" text-anchor="start">将运行问题加入回归用例</text>
<path d="M 830 1070 H 885 V 895 H 920" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#adc2626)" stroke-dasharray="7 5"/>
<rect x="992.0" y="989" width="126" height="26" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="1055" y="1007" font-size="18" fill="#dc2626" font-weight="400" text-anchor="middle">发现新版回归</text>
<rect x="920" y="840" width="300" height="110" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="1070.0" y="875" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">回滚使用版本</text>
<text x="1070.0" y="910" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">恢复兼容的上一稳定版</text>
<path d="M 1070 840 V 805 H 865 V 875 H 830" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#adc2626)" stroke-dasharray="7 5"/>
<rect x="945.0" y="772" width="180" height="26" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="1035" y="790" font-size="18" fill="#dc2626" font-weight="400" text-anchor="middle">切回稳定版继续观测</text>
<path d="M 885 1070 V 1260 H 920" fill="none" stroke="#6b7280" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#a6b7280)" stroke-dasharray="7 5"/>
<rect x="920" y="1190" width="300" height="140" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="1070.0" y="1225" font-size="23" fill="#111827" font-weight="600" text-anchor="middle">废弃 → 迁移 → 退役</text>
<text x="1070.0" y="1260" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">替换使用方与依赖</text>
<text x="1070.0" y="1289" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">停止新任务选择</text>
<text x="1070.0" y="1318" font-size="19" fill="#6b7280" font-weight="400" text-anchor="middle">保留必要审计记录</text>
<rect x="967.61" y="1145" width="174.78000000000003" height="26" rx="3" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="1055" y="1163" font-size="18" fill="#6b7280" font-weight="400" text-anchor="middle">被替代 / 不再适用</text>
<rect x="60" y="1190" width="770" height="140" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="85" y="1228" font-size="23" fill="#111827" font-weight="600" text-anchor="start">每次发布记录</text>
<text x="85" y="1264" font-size="21" fill="#6b7280" font-weight="400" text-anchor="start">版本号 + 变更说明 + 能力包摘要 + 依赖契约</text>
<text x="85" y="1300" font-size="21" fill="#6b7280" font-weight="400" text-anchor="start">验证集与结果 + Owner + 上一稳定版</text>
<text x="60" y="1382" font-size="19" fill="#6b7280" font-weight="400" text-anchor="start">蓝实线：首次交付路径   红虚线：失败修订 / 回滚   紫虚线：迭代   灰虚线：退役</text>
<text x="60" y="1420" font-size="20" fill="#dc2626" font-weight="400" text-anchor="start">回滚前检查兼容性与任务状态；切换 Skill 版本不会撤销已发生的外部操作。</text>
</svg>
