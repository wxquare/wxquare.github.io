<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img">
<title>授权与沙箱是独立防线</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#648098"/></marker></defs>
<rect width="1200" height="430" rx="18" fill="#f4f7fb"/>
<g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#17324d">
<text x="38" y="51" font-size="27" font-weight="600">授权与沙箱是独立防线</text>
<text x="38" y="80" font-size="15" fill="#63788b">AI Agent 工程 · 本书教学关系图</text>
<rect x="38" y="118" width="257" height="158" rx="12" fill="white" stroke="#d5e0eb"/>
<rect x="38" y="118" width="257" height="6" rx="3" fill="#2563a6"/>
<text x="56" y="154" font-size="21" font-weight="600">身份与策略</text>
<text x="56" y="190" font-size="18">谁可对哪些资源做什么</text>
<path d="M298 197 H320" stroke="#648098" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="327" y="118" width="257" height="158" rx="12" fill="white" stroke="#d5e0eb"/>
<rect x="327" y="118" width="257" height="6" rx="3" fill="#167a78"/>
<text x="345" y="154" font-size="21" font-weight="600">审批绑定</text>
<text x="345" y="190" font-size="18">参数哈希、范围与有效期</text>
<path d="M587 197 H609" stroke="#648098" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="616" y="118" width="257" height="158" rx="12" fill="white" stroke="#d5e0eb"/>
<rect x="616" y="118" width="257" height="6" rx="3" fill="#7561a5"/>
<text x="634" y="154" font-size="21" font-weight="600">执行隔离</text>
<text x="634" y="190" font-size="18">文件、进程、网络与凭据</text>
<path d="M876 197 H898" stroke="#648098" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="905" y="118" width="257" height="158" rx="12" fill="white" stroke="#d5e0eb"/>
<rect x="905" y="118" width="257" height="6" rx="3" fill="#b56826"/>
<text x="923" y="154" font-size="21" font-weight="600">审计与回归</text>
<text x="923" y="190" font-size="18">允许和拒绝路径都验证</text>
<rect x="38" y="312" width="354" height="79" rx="9" fill="#e6eef6"/>
<text x="54" y="342" font-size="17">Prompt 不是权限边界</text>
<rect x="424" y="312" width="354" height="79" rx="9" fill="#e6eef6"/>
<text x="440" y="342" font-size="17">容器不自动隔离网络</text>
<rect x="810" y="312" width="354" height="79" rx="9" fill="#e6eef6"/>
<text x="826" y="342" font-size="17">批准不等于诊断正确</text>
</g></svg>