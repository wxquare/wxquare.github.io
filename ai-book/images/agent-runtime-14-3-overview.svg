<text x="280.0" y="1050" text-anchor="middle" font-size="18" font-weight="400" fill="#475569">保持未就绪</text>
<text x="720.0" y="1020" text-anchor="middle" font-size="22" font-weight="600" fill="#64748b">可选依赖失败</text>
<text x="720.0" y="1050" text-anchor="middle" font-size="18" font-weight="400" fill="#475569">关闭相关能力并声明降级</text>
<text x="1160.0" y="1020" text-anchor="middle" font-size="22" font-weight="600" fill="#64748b">受理事务失败</text>
<text x="1160.0" y="1050" text-anchor="middle" font-size="18" font-weight="400" fill="#475569">不返回持久受理承诺</text>
