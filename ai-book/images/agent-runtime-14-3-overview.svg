<rect width="1440" height="1170" fill="#ffffff"/>
<text x="60" y="46" font-size="18" font-weight="600" fill="#2563eb">AGENT RUNTIME / 14.3</text>
<text x="60" y="91" font-size="32" font-weight="600" fill="#111827">先发布实例能力，再承诺一次任务</text>
<text x="60" y="128" font-size="20" fill="#64748b">实例级配置决定能提供什么；任务级受理决定本次允许做什么</text>
