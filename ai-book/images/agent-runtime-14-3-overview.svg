<text x="1200.0" y="741.5" text-anchor="middle" font-size="23" font-weight="600" fill="#059669">持久受理</text>
<text x="1200.0" y="781.5" text-anchor="middle" font-size="19" font-weight="400" fill="#475569">Task / Run / Outbox</text>
