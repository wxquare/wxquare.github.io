<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1170" viewBox="0 0 1440 1170" role="img" aria-labelledby="title desc">
<title id="title">14.3 先发布实例能力，再承诺一次任务</title>
<desc id="desc">实例级配置决定能提供什么；任务级受理决定本次允许做什么。本书通用 Runtime 参考设计。</desc>
