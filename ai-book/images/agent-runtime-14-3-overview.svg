<text x="84" y="649" text-anchor="start" font-size="24" font-weight="600" fill="#059669">任务级受理</text>
<rect x="60" y="955" width="1320" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="84" y="989" text-anchor="start" font-size="20" font-weight="600" fill="#64748b">失败出口</text>
