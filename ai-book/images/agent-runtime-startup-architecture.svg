<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1480" viewBox="0 0 1600 1480" role="img" aria-labelledby="title desc">
<title id="title">Runtime 启动架构：从配置到能力就绪与任务绑定</title>
<desc id="desc">入口解析角色与工作区，合成生效配置并检查策略和依赖。按依赖装配基础设施、Skill 元数据、MCP Client 和 Connector，再生成能力快照并完成角色就绪检查。必需依赖失败时不就绪，可选依赖失败时降级。用户身份、业务连接和预算在受理任务时绑定。</desc>
<style>text{font-family:Helvetica Neue,Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif} .body{font-size:19px;fill:#475569} .title{font-size:22px;font-weight:600;fill:#111827}</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#059669"/></marker>
<marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#ea580c"/></marker>
</defs>
<rect width="1600" height="1480" fill="#ffffff"/>
<text x="64" y="46" text-anchor="start" font-size="18" font-weight="600" fill="#2563eb">AGENT RUNTIME / 17.3</text>
<text x="64" y="94" text-anchor="start" font-size="34" font-weight="600" fill="#111827">Runtime 启动：从配置到能力就绪与任务绑定</text>
<text x="64" y="132" text-anchor="start" font-size="20" font-weight="400" fill="#475569">本书参考设计 · 启动阶段不需要调用模型；组件按部署角色装配，用户授权在任务期核验</text>
<rect x="64" y="180" width="320" height="120" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="88" y="216" text-anchor="start" font-size="22" font-weight="600" fill="#111827">01 入口与角色</text>
<text x="88" y="252" text-anchor="start" font-size="19" font-weight="400" fill="#475569">CLI / API / Worker</text>
<text x="88" y="283" text-anchor="start" font-size="19" font-weight="400" fill="#475569">工作区、环境、启动参数</text>
<rect x="456" y="180" width="640" height="120" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="480" y="216" text-anchor="start" font-size="22" font-weight="600" fill="#111827">02 配置解析与策略合成</text>
<text x="480" y="252" text-anchor="start" font-size="19" font-weight="400" fill="#475569">默认值 + 部署覆盖 + 不可放宽的组织上限</text>
<text x="480" y="283" text-anchor="start" font-size="19" font-weight="400" fill="#475569">校验 manifest、制品来源、版本与路径</text>
<rect x="1168" y="180" width="368" height="120" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.6"/>
<text x="1192" y="216" text-anchor="start" font-size="22" font-weight="600" fill="#111827">03 校验与装配计划</text>
<text x="1192" y="252" text-anchor="start" font-size="18" font-weight="400" fill="#475569">生成依赖图、超时与失败策略</text>
<text x="1192" y="283" text-anchor="start" font-size="18" font-weight="400" fill="#475569">声明必需 / 可选、eager / lazy</text>
<path d="M384,240 H456" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M1096,240 H1168" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="456" y="344" width="640" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
<path d="M480,362 H498 L508,372 V414 H480 Z M498,362 V372 H508" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="528" y="380" text-anchor="start" font-size="20" font-weight="600" fill="#334155">runtime.yaml / 环境配置 / 组织强制策略</text>
<text x="528" y="414" text-anchor="start" font-size="19" font-weight="400" fill="#475569">manifest 引用、指令来源、Skill 与连接目录</text>
<path d="M776,344 V300" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect x="64" y="472" width="1472" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="8 6"/>
<text x="88" y="510" text-anchor="start" font-size="22" font-weight="600" fill="#334155">按依赖装配能力：无依赖分支可并行；执行外部代码前检查来源与策略</text>
<path d="M1352,300 V560" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M248,560 H1352" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M248,560 V600" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M616,560 V600" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M984,560 V600" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M1352,560 V600" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="88" y="600" width="320" height="160" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="112" y="636" text-anchor="start" font-size="22" font-weight="600" fill="#111827">模型与基础设施</text>
<text x="112" y="672" text-anchor="start" font-size="18" font-weight="400" fill="#475569">状态 / 事件 / Artifact / 观测</text>
<text x="112" y="703" text-anchor="start" font-size="18" font-weight="400" fill="#475569">模型客户端 / 执行后端</text>
<text x="112" y="734" text-anchor="start" font-size="18" font-weight="400" fill="#475569">按角色检查，不触发业务写入</text>
<rect x="456" y="600" width="320" height="160" rx="10" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.6"/>
<text x="480" y="636" text-anchor="start" font-size="22" font-weight="600" fill="#111827">Skill 元数据索引</text>
<text x="480" y="672" text-anchor="start" font-size="18" font-weight="400" fill="#475569">允许的目录 / 发布包</text>
<text x="480" y="703" text-anchor="start" font-size="18" font-weight="400" fill="#475569">SKILL.md → 元数据索引</text>
<text x="480" y="734" text-anchor="start" font-size="18" font-weight="400" fill="#475569">正文、脚本按任务需要加载</text>
<rect x="824" y="600" width="320" height="160" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.6"/>
<text x="848" y="636" text-anchor="start" font-size="22" font-weight="600" fill="#111827">MCP Client / 工具目录</text>
<text x="848" y="672" text-anchor="start" font-size="18" font-weight="400" fill="#475569">本地 stdio / 远程 HTTP</text>
<text x="848" y="703" text-anchor="start" font-size="18" font-weight="400" fill="#475569">版本检查 / tools/list</text>
<text x="848" y="734" text-anchor="start" font-size="18" font-weight="400" fill="#475569">eager 就绪 / lazy 待激活</text>
<rect x="1192" y="600" width="320" height="160" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<text x="1216" y="636" text-anchor="start" font-size="22" font-weight="600" fill="#111827">Connector 适配与连接</text>
<text x="1216" y="672" text-anchor="start" font-size="18" font-weight="400" fill="#475569">适配器 / 凭证提供方</text>
<text x="1216" y="703" text-anchor="start" font-size="18" font-weight="400" fill="#475569">静态映射 / Connection 存储</text>
<text x="1216" y="734" text-anchor="start" font-size="18" font-weight="400" fill="#475569">用户授权与账号按任务绑定</text>
<path d="M248,760 V848" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M616,760 V848" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M984,760 V848" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1352,760 V848" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M248,848 H1352" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M800,848 V888" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect x="456" y="888" width="640" height="116" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.6"/>
<text x="480" y="924" text-anchor="start" font-size="22" font-weight="600" fill="#111827">04 能力快照 / Registry</text>
<text x="480" y="960" text-anchor="start" font-size="20" font-weight="400" fill="#475569">来源、版本、工具契约、依赖、可用状态</text>
<text x="480" y="991" text-anchor="start" font-size="20" font-weight="400" fill="#475569">关联生效配置摘要，不保存明文业务凭证</text>
<path d="M800,1004 V1080" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="608" y="1080" width="384" height="110" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="632" y="1116" text-anchor="start" font-size="22" font-weight="600" fill="#111827">05 角色就绪检查</text>
<text x="632" y="1152" text-anchor="start" font-size="19" font-weight="400" fill="#475569">必需依赖 / 隔离 / 兼容版本</text>
<rect x="64" y="1080" width="448" height="110" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.6"/>
<text x="88" y="1116" text-anchor="start" font-size="22" font-weight="600" fill="#111827">NotReady：拒绝相关角色服务</text>
<text x="88" y="1152" text-anchor="start" font-size="19" font-weight="400" fill="#475569">必需依赖失败，或必需隔离不可用</text>
<rect x="1088" y="1080" width="448" height="110" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<text x="1112" y="1116" text-anchor="start" font-size="22" font-weight="600" fill="#111827">可选能力降级</text>
<text x="1112" y="1152" text-anchor="start" font-size="19" font-weight="400" fill="#475569">公开不可用范围，限制任务受理与路由</text>
<path d="M608,1135 H512" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
<path d="M992,1135 H1088" fill="none" stroke="#ea580c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<path d="M800,1190 V1260" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="760" y="1210" width="80" height="27" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="1.6"/>
<text x="800" y="1230" text-anchor="middle" font-size="19" font-weight="600" fill="#2563eb">Ready</text>
<rect x="608" y="1260" width="384" height="110" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="632" y="1296" text-anchor="start" font-size="22" font-weight="600" fill="#111827">06 受理与 Run 绑定</text>
<text x="632" y="1332" text-anchor="start" font-size="18" font-weight="400" fill="#475569">身份 / 连接 / 能力版本 / 预算</text>
<text x="632" y="1363" text-anchor="start" font-size="18" font-weight="400" fill="#475569">通过裁决后进入执行循环</text>
<text x="64" y="1292" text-anchor="start" font-size="21" font-weight="600" fill="#334155">实例就绪 ≠ 用户授权</text>
<text x="64" y="1326" text-anchor="start" font-size="19" font-weight="400" fill="#475569">Skill 可发现 ≠ 正文已加载</text>
<text x="64" y="1358" text-anchor="start" font-size="19" font-weight="400" fill="#475569">MCP 可连接 ≠ 动作已批准</text>
<text x="1088" y="1292" text-anchor="start" font-size="20" font-weight="600" fill="#334155">Connector 可部署在 MCP 服务侧</text>
<text x="1088" y="1326" text-anchor="start" font-size="19" font-weight="400" fill="#475569">Host 不负责启动所有远程服务</text>
<text x="1088" y="1358" text-anchor="start" font-size="19" font-weight="400" fill="#475569">lazy 与按用户连接在任务期继续准备</text>
<path d="M64,1430 H108" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="122" y="1436" text-anchor="start" font-size="18" font-weight="400" fill="#475569">装配 / 执行顺序</text>
<path d="M464,1430 H508" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text x="522" y="1436" text-anchor="start" font-size="18" font-weight="400" fill="#475569">配置与能力描述</text>
<path d="M864,1430 H908" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
<text x="922" y="1436" text-anchor="start" font-size="18" font-weight="400" fill="#475569">必需条件失败</text>
<path d="M1224,1430 H1268" fill="none" stroke="#ea580c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="1282" y="1436" text-anchor="start" font-size="18" font-weight="400" fill="#475569">可选能力降级</text>
</svg>
