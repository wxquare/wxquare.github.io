<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1460" viewBox="0 0 1600 1460" role="img" aria-labelledby="title desc">
<title id="title">MCP Server 内部组装与请求处理</title>
<desc id="desc">服务提供方将能力定义、部署配置和 Connector 依赖绑定为 Server 注册表。Client 请求先经协议校验、请求级认证和资源授权，再由 handler 调用受限 Connector。下游业务结果经过过滤和 Schema 校验，编码为 MCP 结果返回 Client。Host 的模型、审批与任务恢复在本图边界之外。</desc>
<style>text{font-family:Helvetica Neue,Helvetica,Arial,PingFang SC,Microsoft YaHei,sans-serif}</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#059669"/></marker>
</defs>
<rect width="1600" height="1460" fill="#ffffff"/>
<text x="64" y="46" font-size="18" font-weight="600" fill="#2563eb">EXTERNAL CAPABILITIES / 16.5</text>
<text x="64" y="94" font-size="34" font-weight="600" fill="#111827">MCP Server：把业务实现封装成可交付的协议能力</text>
<text x="64" y="130" font-size="20" font-weight="400" fill="#475569">本书服务端参考设计 · 注册与请求身份分开 · Host 的模型循环、审批和任务恢复见第 17 章</text>
<rect x="64" y="176" width="416" height="116" rx="10" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.6"/>
<text x="86" y="211" font-size="22" font-weight="600" fill="#111827">能力定义</text>
<text x="86" y="246" font-size="18" font-weight="400" fill="#475569">Tool Schema / Resource / Prompt</text>
<text x="86" y="277" font-size="18" font-weight="400" fill="#475569">固定版本、输出契约、风险声明</text>
<rect x="592" y="176" width="416" height="116" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="614" y="211" font-size="22" font-weight="600" fill="#111827">部署与协议配置</text>
<text x="614" y="246" font-size="18" font-weight="400" fill="#475569">支持版本 / stdio 或 HTTP</text>
<text x="614" y="277" font-size="18" font-weight="400" fill="#475569">身份、策略、配额与审计配置</text>
<rect x="1120" y="176" width="416" height="116" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<text x="1142" y="211" font-size="22" font-weight="600" fill="#111827">Connector 与业务依赖</text>
<text x="1142" y="246" font-size="18" font-weight="400" fill="#475569">API 适配器 / 凭证提供方</text>
<text x="1142" y="277" font-size="18" font-weight="400" fill="#475569">参数映射、分页、错误与效果查询</text>
<path d="M272,292 V330" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M800,292 V330" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1328,292 V330" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M272,330 H1328" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="352" y="368" width="1184" height="792" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="8 6"/>
<text x="384" y="410" font-size="23" font-weight="600" fill="#334155">MCP Server 进程 / 服务边界</text>
<path d="M1140,330 V448" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect x="384" y="448" width="1112" height="108" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.6"/>
<text x="406" y="483" font-size="22" font-weight="600" fill="#111827">能力注册与依赖绑定</text>
<text x="406" y="518" font-size="18" font-weight="400" fill="#475569">名称 → handler / reader / renderer；依赖、Schema 与实现版本固定</text>
<path d="M536,556 V680" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M920,556 V680" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M1324,556 V680" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect x="64" y="680" width="240" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="86" y="715" font-size="22" font-weight="600" fill="#111827">Host 内的 Client</text>
<text x="86" y="750" font-size="18" font-weight="400" fill="#475569">发送标准请求</text>
<text x="86" y="781" font-size="18" font-weight="400" fill="#475569">接收结果或交互需求</text>
<rect x="384" y="680" width="304" height="120" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="406" y="715" font-size="22" font-weight="600" fill="#111827">协议入口与校验</text>
<text x="406" y="750" font-size="18" font-weight="400" fill="#475569">版本 / 格式 / 输入 Schema</text>
<text x="406" y="781" font-size="18" font-weight="400" fill="#475569">解析工具与目标资源</text>
<rect x="760" y="680" width="320" height="120" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.6"/>
<text x="782" y="715" font-size="22" font-weight="600" fill="#111827">认证与资源授权</text>
<text x="782" y="750" font-size="18" font-weight="400" fill="#475569">请求级 Principal / Scope</text>
<text x="782" y="781" font-size="18" font-weight="400" fill="#475569">工具资格与目标资源范围</text>
<rect x="1152" y="680" width="344" height="120" rx="10" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.6"/>
<text x="1174" y="715" font-size="22" font-weight="600" fill="#111827">业务 handler</text>
<text x="1174" y="750" font-size="18" font-weight="400" fill="#475569">业务语义校验与查询构造</text>
<text x="1174" y="781" font-size="18" font-weight="400" fill="#475569">只消费受限授权上下文</text>
<path d="M304,720 H384" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M688,740 H760" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M1080,740 H1152" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="1152" y="912" width="344" height="120" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<text x="1174" y="947" font-size="22" font-weight="600" fill="#111827">受限 Connector</text>
<text x="1174" y="982" font-size="18" font-weight="400" fill="#475569">取得当前主体的必要凭据</text>
<text x="1174" y="1013" font-size="18" font-weight="400" fill="#475569">执行查询或业务写入</text>
<path d="M1324,800 V912" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="384" y="912" width="640" height="120" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.6"/>
<text x="406" y="947" font-size="22" font-weight="600" fill="#111827">结果过滤、校验与协议编码</text>
<text x="406" y="982" font-size="18" font-weight="400" fill="#475569">结构化结果 / 安全文本 / 工具错误 / 补输入请求</text>
<text x="406" y="1013" font-size="18" font-weight="400" fill="#475569">保留来源、分页缺口与效果证据，私密载荷受控</text>
<path d="M1152,972 H1024" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<path d="M384,972 H336 V760 H304" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text x="64" y="946" font-size="20" font-weight="600" fill="#334155">Host 负责：</text>
<text x="64" y="980" font-size="18" font-weight="400" fill="#475569">模型工具选择与裁决</text>
<text x="64" y="1012" font-size="18" font-weight="400" fill="#475569">交互等待与观察回填</text>
<text x="64" y="1044" font-size="18" font-weight="400" fill="#475569">任务重试与结果核验</text>
<text x="384" y="1090" font-size="20" font-weight="600" fill="#334155">注册表不保存“当前团队”或 Token；发现过滤不能替代执行授权。</text>
<text x="384" y="1128" font-size="19" font-weight="400" fill="#475569">Resources 与 Prompts 的受保护读取也经过同一身份与资源边界。</text>
<rect x="1152" y="1240" width="344" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="1174" y="1275" font-size="22" font-weight="600" fill="#111827">下游业务系统</text>
<text x="1174" y="1310" font-size="18" font-weight="400" fill="#475569">日志 / 工单 / 知识 API</text>
<text x="1174" y="1341" font-size="18" font-weight="400" fill="#475569">独立鉴权、对象状态与回执</text>
<path d="M1324,1032 V1240" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="1235" y="1180" width="178" height="30" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="1.6"/>
<text x="1243" y="1202" font-size="19" font-weight="600" fill="#2563eb">授权范围内访问</text>
<path d="M1496,1300 H1568 V972 H1496" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect x="64" y="1240" width="960" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="88" y="1278" font-size="22" font-weight="600" fill="#111827">服务提供方交付：</text>
<text x="88" y="1312" font-size="20" font-weight="400" fill="#475569">制品、能力目录、支持版本、认证要求、依赖说明、测试证据与已知限制</text>
<text x="88" y="1344" font-size="19" font-weight="400" fill="#475569">协议可连接 ≠ 获准读取资源；正常返回 result ≠ 业务效果已确认</text>
<path d="M64,1415 H112" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<text x="128" y="1422" font-size="19" font-weight="400" fill="#475569">请求处理 / 业务访问</text>
<path d="M640,1415 H688" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text x="704" y="1422" font-size="19" font-weight="400" fill="#475569">定义与依赖绑定 / 结果与回执返回</text>
</svg>
