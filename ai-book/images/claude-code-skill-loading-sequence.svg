<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1740" viewBox="0 0 1440 1740" role="img" aria-labelledby="title desc">
<title id="title">Claude Code：Skill 发现与多次 LLM 请求时序</title>
<desc id="desc">Claude Code 客户端先发现并构建元数据索引，首次请求使模型知道技能存在；模型提出加载调用后，客户端读取正文，在第二次请求提供正文，再按需读取参考资料并继续请求；用户下一轮沿用被保留的上下文。</desc>
<style>text{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}</style><defs>
<marker id="a2563eb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#2563eb"/></marker>
<marker id="a6b7280" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#6b7280"/></marker>
</defs>
<rect x="0" y="0" width="1440" height="1740" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="55" y="57" font-size="31" fill="#111827" text-anchor="start" font-weight="600">Claude Code：先发现 Skill，再逐次提供执行上下文</text>
<text x="55" y="98" font-size="19" fill="#6b7280" text-anchor="start" font-weight="400">官方文档核验：2026-10-21 · 默认内联 Skill；省略 fork 与动态注入分支</text>
<rect x="60" y="132" width="360" height="72" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="240" y="162" font-size="22" fill="#111827" text-anchor="middle" font-weight="600">Claude Code 客户端</text>
<text x="240" y="190" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="400">发现、执行调用与组装请求</text>
<path d="M240 204 V 1570" stroke="#cbd5e1" stroke-dasharray="6 6" stroke-width="1.5"/>
<rect x="530" y="132" width="360" height="72" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="710" y="162" font-size="22" fill="#111827" text-anchor="middle" font-weight="600">Skill 文件 / 索引</text>
<text x="710" y="190" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="400">元数据、正文与配套资源</text>
<path d="M710 204 V 1570" stroke="#cbd5e1" stroke-dasharray="6 6" stroke-width="1.5"/>
<rect x="1010" y="132" width="360" height="72" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="1190" y="162" font-size="22" fill="#111827" text-anchor="middle" font-weight="600">Claude 模型</text>
<text x="1190" y="190" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="400">只依据当前可见上下文决策</text>
<path d="M1190 204 V 1570" stroke="#cbd5e1" stroke-dasharray="6 6" stroke-width="1.5"/>
<rect x="235" y="270" width="10" height="70" rx="0" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<rect x="705" y="270" width="10" height="70" rx="0" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<rect x="1185" y="465" width="10" height="110" rx="0" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<rect x="235" y="685" width="10" height="100" rx="0" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<rect x="705" y="685" width="10" height="100" rx="0" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<rect x="1185" y="835" width="10" height="100" rx="0" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<rect x="235" y="1035" width="10" height="95" rx="0" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<rect x="705" y="1035" width="10" height="95" rx="0" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<rect x="1185" y="1190" width="10" height="105" rx="0" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<rect x="1185" y="1460" width="10" height="80" rx="0" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<rect x="55" y="235" width="1330" height="135" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="68" y="219" width="561" height="32" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="80" y="243" font-size="22" fill="#334155" text-anchor="start" font-weight="600">0 · 首次模型请求前：客户端发现能力，LLM 尚未参与</text>
<path d="M 240 280 H 710" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#a2563eb)"/>
<rect x="278.1" y="244" width="393.8" height="28" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="475.0" y="265" font-size="21" fill="#2563eb" text-anchor="middle" font-weight="400">扫描 .claude/skills 与启用的插件等</text>
<path d="M 710 340 H 240" fill="none" stroke="#6b7280" stroke-width="2.3" marker-end="url(#a6b7280)" stroke-dasharray="7 5"/>
<rect x="297.0" y="304" width="356" height="28" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="475.0" y="325" font-size="21" fill="#6b7280" text-anchor="middle" font-weight="400">可自动调用的名称、描述与调用控制</text>
<rect x="55" y="420" width="1330" height="180" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="68" y="404" width="459" height="32" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="80" y="428" font-size="22" fill="#334155" text-anchor="start" font-weight="600">1 · LLM 请求 1：让模型知道有这个 Skill</text>
<path d="M 240 490 H 1190" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#a2563eb)"/>
<rect x="503.925" y="425" width="422.15" height="28" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="715.0" y="446" font-size="21" fill="#2563eb" text-anchor="middle" font-weight="400">常驻规则 + 可用 Skill 描述 + 用户任务</text>
<rect x="532.65" y="457" width="364.7" height="25" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="715.0" y="475" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="400">同时提供 Skill 入口及 Read 等工具定义</text>
<path d="M 1190 570 H 240" fill="none" stroke="#6b7280" stroke-width="2.3" marker-end="url(#a6b7280)" stroke-dasharray="7 5"/>
<rect x="534.9" y="505" width="360.20000000000005" height="28" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="715.0" y="526" font-size="21" fill="#6b7280" text-anchor="middle" font-weight="400">Skill 调用：incident-diagnosis</text>
<rect x="552.0" y="537" width="326" height="25" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="715.0" y="555" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="400">模型返回调用意图；此时还未拿到正文</text>
<rect x="55" y="650" width="1330" height="310" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="68" y="634" width="355" height="32" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="80" y="658" font-size="22" fill="#334155" text-anchor="start" font-weight="600">2 · 加载正文，发出 LLM 请求 2</text>
<path d="M 240 700 H 710" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#a2563eb)"/>
<rect x="339.525" y="664" width="270.95000000000005" height="28" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="475.0" y="685" font-size="21" fill="#2563eb" text-anchor="middle" font-weight="400">定位并展开所选 SKILL.md</text>
<path d="M 710 780 H 240" fill="none" stroke="#6b7280" stroke-width="2.3" marker-end="url(#a6b7280)" stroke-dasharray="7 5"/>
<rect x="328.5" y="744" width="293" height="28" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="475.0" y="765" font-size="21" fill="#6b7280" text-anchor="middle" font-weight="400">返回正文，按客户端规则渲染</text>
<path d="M 240 860 H 1190" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#a2563eb)"/>
<rect x="542.25" y="795" width="345.5" height="28" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="715.0" y="816" font-size="21" fill="#2563eb" text-anchor="middle" font-weight="400">前文 + 已展开的 Skill 内容消息</text>
<rect x="534.0" y="827" width="362" height="25" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="715.0" y="845" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="400">现在模型才看到完整流程、约束与资源入口</text>
<path d="M 1190 935 H 240" fill="none" stroke="#6b7280" stroke-width="2.3" marker-end="url(#a6b7280)" stroke-dasharray="7 5"/>
<rect x="491.85" y="870" width="446.3" height="28" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="715.0" y="891" font-size="21" fill="#6b7280" text-anchor="middle" font-weight="400">Read 等工具调用：references/metrics.md</text>
<rect x="552.0" y="902" width="326" height="25" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="715.0" y="920" font-size="18" fill="#6b7280" text-anchor="middle" font-weight="400">示例：根据正文发现需要核验指标口径</text>
<rect x="55" y="1000" width="1330" height="325" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="68" y="984" width="553" height="32" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="80" y="1008" font-size="22" fill="#334155" text-anchor="start" font-weight="600">3 · 按需加载资源，发出 LLM 请求 3；继续工具闭环</text>
<path d="M 240 1050 H 710" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#a2563eb)"/>
<rect x="318.0" y="1014" width="314" height="28" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="475.0" y="1035" font-size="21" fill="#2563eb" text-anchor="middle" font-weight="400">通过读取工具获取相关参考资料</text>
<path d="M 710 1125 H 240" fill="none" stroke="#6b7280" stroke-width="2.3" marker-end="url(#a6b7280)" stroke-dasharray="7 5"/>
<rect x="297.0" y="1089" width="356" height="28" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="475.0" y="1110" font-size="21" fill="#6b7280" text-anchor="middle" font-weight="400">返回当前文件内容，不展开整个目录</text>
<path d="M 240 1215 H 1190" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#a2563eb)"/>
<rect x="509.7" y="1150" width="410.6" height="28" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="715.0" y="1171" font-size="21" fill="#2563eb" text-anchor="middle" font-weight="400">前文 + Skill 内容消息 + 参考资料结果</text>
<rect x="507.0" y="1182" width="416" height="25" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="715.0" y="1200" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="400">原任务与必要历史继续可见，不是只发送最新文件</text>
<path d="M 1190 1290 H 240" fill="none" stroke="#6b7280" stroke-width="2.3" marker-end="url(#a6b7280)" stroke-dasharray="7 5"/>
<rect x="547.5" y="1254" width="335" height="28" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="715.0" y="1275" font-size="21" fill="#6b7280" text-anchor="middle" font-weight="400">进一步工具调用，或完成诊断报告</text>
<rect x="55" y="1390" width="1330" height="170" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="68" y="1374" width="601" height="32" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="80" y="1398" font-size="22" fill="#334155" text-anchor="start" font-weight="600">4 · 用户下一轮追问：继续同一会话，而不是重新训练模型</text>
<path d="M 240 1470 H 1190" fill="none" stroke="#2563eb" stroke-width="2.3" marker-end="url(#a2563eb)"/>
<rect x="561.675" y="1405" width="306.65000000000003" height="28" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="715.0" y="1426" font-size="21" fill="#2563eb" text-anchor="middle" font-weight="400">沿用已加载内容 + 新用户消息</text>
<rect x="561.0" y="1437" width="308" height="25" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="715.0" y="1455" font-size="18" fill="#2563eb" text-anchor="middle" font-weight="400">示例追问：把刚才的证据整理成表格</text>
<path d="M 1190 1540 H 240" fill="none" stroke="#6b7280" stroke-width="2.3" marker-end="url(#a6b7280)" stroke-dasharray="7 5"/>
<rect x="558.0" y="1504" width="314" height="28" rx="2" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="715.0" y="1525" font-size="21" fill="#6b7280" text-anchor="middle" font-weight="400">基于仍然可见的上下文继续回答</text>
<rect x="55" y="1600" width="1330" height="70" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="80" y="1628" font-size="20" fill="#334155" text-anchor="start" font-weight="400">手动 /skill 可提前展开；隐藏描述的 Skill 不能按默认路径自动发现。</text>
<text x="80" y="1655" font-size="19" fill="#6b7280" text-anchor="start" font-weight="400">压缩、截断或新会话可能改变可见内容；必要时重新加载。索引与正文都不是模型的永久记忆。</text>
<text x="55" y="1712" font-size="19" fill="#6b7280" text-anchor="start" font-weight="400">蓝实线：客户端的请求 / 读取    灰虚线：模型响应 / 文件返回    窄条：处理活动</text>
</svg>
