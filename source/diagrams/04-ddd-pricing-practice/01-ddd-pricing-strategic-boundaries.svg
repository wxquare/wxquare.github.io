<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ddd-pricing-strategic-boundaries-title ddd-pricing-strategic-boundaries-desc" id="ddd-pricing-strategic-boundaries-root">
        <title id="ddd-pricing-strategic-boundaries-title">电商计价的 DDD 战略边界</title>
        <desc id="ddd-pricing-strategic-boundaries-desc">以计价上下文为核心域，展示商品、价格、营销和用户上下文提供版本化事实，订单上下文接受报价并保存成交快照。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ddd-pricing-strategic-boundaries-root { --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #5a6580;
      --rule: rgba(45,49,66,0.16);
      --accent: #bf4520;
      --accent-tint: rgba(191,69,32,0.08);
      --link: #2e5aa8;
      --sans: 'Geist', 'Noto Sans SC', system-ui, sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif SC', serif;
      --mono: 'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace; }
      #ddd-pricing-strategic-boundaries-root { color: var(--ink); font-family: var(--sans); }
      #ddd-pricing-strategic-boundaries-root .diagram-container { width: 100%; overflow-x: auto; }
      #ddd-pricing-strategic-boundaries-root .diagram-container { overflow-x: visible; }
      #ddd-pricing-strategic-boundaries-root .zone { fill: rgba(45,49,66,0.025); stroke: rgba(45,49,66,0.16); stroke-width: 1; }
      #ddd-pricing-strategic-boundaries-root .zone-label { fill: var(--soft); font: 500 10px var(--mono); letter-spacing: .14em; }
      #ddd-pricing-strategic-boundaries-root .node { stroke-width: 1.4; }
      #ddd-pricing-strategic-boundaries-root .supporting { fill: #ececec; stroke: #4f5d75; }
      #ddd-pricing-strategic-boundaries-root .core { fill: var(--accent-tint); stroke: var(--accent); }
      #ddd-pricing-strategic-boundaries-root .order { fill: #e5eaf2; stroke: var(--link); }
      #ddd-pricing-strategic-boundaries-root .tag { fill: none; stroke-width: .9; }
      #ddd-pricing-strategic-boundaries-root .tag-text { font: 500 9px var(--mono); letter-spacing: .08em; text-anchor: middle; }
      #ddd-pricing-strategic-boundaries-root .node-name { fill: var(--ink); font: 600 18px var(--sans); text-anchor: middle; }
      #ddd-pricing-strategic-boundaries-root .node-sub { fill: var(--muted); font: 400 12px var(--mono); text-anchor: middle; }
      #ddd-pricing-strategic-boundaries-root .node-note { fill: var(--soft); font: 400 11px var(--sans); text-anchor: middle; }
      #ddd-pricing-strategic-boundaries-root .connector { fill: none; stroke: var(--muted); stroke-width: 1.5; }
      #ddd-pricing-strategic-boundaries-root .connector-accent { fill: none; stroke: var(--accent); stroke-width: 2; }
      #ddd-pricing-strategic-boundaries-root .connector-link { fill: none; stroke: var(--link); stroke-width: 1.5; stroke-dasharray: 6 5; }
      #ddd-pricing-strategic-boundaries-root .arrow-label-bg { fill: var(--paper); }
      #ddd-pricing-strategic-boundaries-root .arrow-label { fill: var(--soft); font: 500 10px var(--mono); letter-spacing: .06em; text-anchor: middle; }
      #ddd-pricing-strategic-boundaries-root .callout { fill: var(--ink); font: italic 18px var(--serif); }
      #ddd-pricing-strategic-boundaries-root .callout-small { fill: var(--soft); font: 400 12px var(--sans); }
      #ddd-pricing-strategic-boundaries-root .legend-label { fill: var(--muted); font: 500 10px var(--mono); letter-spacing: .14em; }
      #ddd-pricing-strategic-boundaries-root .legend-text { fill: var(--soft); font: 400 11px var(--sans); }</style>
          <marker id="ddd-pricing-strategic-boundaries-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="ddd-pricing-strategic-boundaries-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="ddd-pricing-strategic-boundaries-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="1280" height="720" fill="#f5f5f5"/>

        <!-- Zones: paint before connectors and nodes. -->
        <rect class="zone" x="40" y="72" width="720" height="480" rx="8"/>
        <rect class="zone" x="792" y="72" width="448" height="480" rx="8"/>
        <rect x="56" y="76" width="164" height="18" rx="2" fill="#f5f5f5"/>
        <text class="zone-label" x="138" y="89" text-anchor="middle">UPSTREAM FACTS</text>
        <rect x="808" y="76" width="170" height="18" rx="2" fill="#f5f5f5"/>
        <text class="zone-label" x="893" y="89" text-anchor="middle">DOWNSTREAM COMMITMENT</text>

        <!-- Primary path: facts -> pricing -> accepted quote/order. -->
        <path class="connector" d="M 220,180 H 360" marker-end="url(#ddd-pricing-strategic-boundaries-arrow)"/>
        <path class="connector" d="M 220,300 H 328 Q 336,300 336,308 V 340 H 360" marker-end="url(#ddd-pricing-strategic-boundaries-arrow)"/>
        <path class="connector" d="M 220,420 H 304 Q 312,420 312,412 V 380 H 360" marker-end="url(#ddd-pricing-strategic-boundaries-arrow)"/>
        <path class="connector-link" d="M 540,216 V 280 H 860 V 304" marker-end="url(#ddd-pricing-strategic-boundaries-arrow-link)"/>
        <path class="connector-accent" d="M 540,404 V 488 H 860 V 456" marker-end="url(#ddd-pricing-strategic-boundaries-arrow-accent)"/>
        <path class="connector-link" d="M 990,456 V 512 H 700 V 536" marker-end="url(#ddd-pricing-strategic-boundaries-arrow-link)"/>

        <!-- Arrow labels, each on a masked open segment. -->
        <rect class="arrow-label-bg" x="252" y="160" width="106" height="18" rx="2"/>
        <text class="arrow-label" x="305" y="173">VERSIONED FACT</text>
        <rect class="arrow-label-bg" x="654" y="258" width="124" height="18" rx="2"/>
        <text class="arrow-label" x="716" y="271">QUOTED PRICE</text>
        <rect class="arrow-label-bg" x="648" y="468" width="136" height="18" rx="2"/>
        <text class="arrow-label" x="716" y="481">ACCEPT + SNAPSHOT</text>
        <rect class="arrow-label-bg" x="732" y="510" width="132" height="18" rx="2"/>
        <text class="arrow-label" x="798" y="523">REFUND EVENT</text>

        <!-- Supporting contexts. -->
        <g>
          <rect class="node supporting" x="76" y="128" width="144" height="104" rx="6"/>
          <rect class="tag" x="88" y="140" width="62" height="18" rx="2" stroke="#4f5d75"/>
          <text class="tag-text" x="119" y="153" fill="#4f5d75">SUPPORT</text>
          <text class="node-name" x="148" y="186">商品上下文</text>
          <text class="node-sub" x="148" y="207">SKU · 计价分类</text>
        </g>
        <g>
          <rect class="node supporting" x="76" y="248" width="144" height="104" rx="6"/>
          <rect class="tag" x="88" y="260" width="62" height="18" rx="2" stroke="#4f5d75"/>
          <text class="tag-text" x="119" y="273" fill="#4f5d75">SUPPORT</text>
          <text class="node-name" x="148" y="306">价格上下文</text>
          <text class="node-sub" x="148" y="327">基础价 · 价格表版本</text>
        </g>
        <g>
          <rect class="node supporting" x="76" y="368" width="144" height="104" rx="6"/>
          <rect class="tag" x="88" y="380" width="62" height="18" rx="2" stroke="#4f5d75"/>
          <text class="tag-text" x="119" y="393" fill="#4f5d75">SUPPORT</text>
          <text class="node-name" x="148" y="426">用户上下文</text>
          <text class="node-sub" x="148" y="447">会员等级 · 分群事实</text>
        </g>
        <g>
          <rect class="node supporting" x="328" y="128" width="144" height="104" rx="6"/>
          <rect class="tag" x="340" y="140" width="62" height="18" rx="2" stroke="#4f5d75"/>
          <text class="tag-text" x="371" y="153" fill="#4f5d75">SUPPORT</text>
          <text class="node-name" x="400" y="186">营销上下文</text>
          <text class="node-sub" x="400" y="207">活动 · 券 · 预算</text>
        </g>

        <!-- Core domain. -->
        <g>
          <rect class="node core" x="360" y="304" width="180" height="136" rx="6"/>
          <rect class="tag" x="374" y="318" width="72" height="18" rx="2" stroke="#bf4520"/>
          <text class="tag-text" x="410" y="331" fill="#bf4520">CORE DOMAIN</text>
          <text class="node-name" x="450" y="370">计价上下文</text>
          <text class="node-sub" x="450" y="391">组合 · 舍入 · 分摊</text>
          <text class="node-note" x="450" y="416">报价是可解释的裁决</text>
        </g>

        <!-- Downstream commitment. -->
        <g>
          <rect class="node order" x="860" y="304" width="210" height="152" rx="6"/>
          <rect class="tag" x="876" y="318" width="70" height="18" rx="2" stroke="#2e5aa8"/>
          <text class="tag-text" x="911" y="331" fill="#2e5aa8">COMMITMENT</text>
          <text class="node-name" x="965" y="372">订单上下文</text>
          <text class="node-sub" x="965" y="394">接受报价 · 履约 · 售后</text>
          <text class="node-note" x="965" y="421">保存成交快照与分摊证据</text>
        </g>

        <!-- Callouts: explain the boundary decisions without adding more nodes. -->
        <text class="callout" x="588" y="150">边界不是服务列表</text>
        <text class="callout-small" x="588" y="176">它回答：谁拥有事实、谁执行不变量、谁承担失败？</text>
        <path d="M 660,188 V 250 H 540" fill="none" stroke="#5a6580" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#ddd-pricing-strategic-boundaries-arrow)"/>

        <line x1="40" y1="588" x2="1240" y2="588" stroke="#2d3142" stroke-opacity="0.16" stroke-width="1"/>
        <text class="legend-label" x="40" y="614">CONTEXT MAP</text>
        <circle cx="172" cy="610" r="6" fill="#bf4520"/>
        <text class="legend-text" x="186" y="614">核心域：计价裁决与解释</text>
        <circle cx="392" cy="610" r="6" fill="#4f5d75"/>
        <text class="legend-text" x="406" y="614">支撑域：提供业务事实</text>
        <circle cx="612" cy="610" r="6" fill="#2e5aa8"/>
        <text class="legend-text" x="626" y="614">承诺边界：订单保存成交证据</text>
        <text class="legend-text" x="40" y="650">反腐层把外部 DTO / 枚举 / 错误翻译为计价自己的语言；跨上下文传递契约，不传递对象引用或共享表。</text>
      </svg>
